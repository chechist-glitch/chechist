<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<style>
  body { background: #f7f1e1; }
  svg { position: absolute; inset: 0; }
</style>
</head>
<body>
  <svg id="s" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
  <script>
    const r = rng(1963);
    const NEGRO = "#141414", ROJO = "#e8262f", AMARILLO = "#ffd400", AZUL = "#1f6fd1", PIEL = "#f7c6a6";
    let s = `<defs>
      <pattern id="benRojo" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><rect width="16" height="16" fill="${AMARILLO}"/><circle cx="8" cy="8" r="4.2" fill="${ROJO}"/></pattern>
      <pattern id="benRojoG" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><rect width="22" height="22" fill="#fff4c2"/><circle cx="11" cy="11" r="7.5" fill="${ROJO}"/></pattern>
      <pattern id="benAzul" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#fff"/><circle cx="7" cy="7" r="4.6" fill="${AZUL}"/></pattern>
      <pattern id="benPiel" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><rect width="12" height="12" fill="#fffaf2"/><circle cx="6" cy="6" r="3.2" fill="#f29a8b"/></pattern>
      <clipPath id="v1"><rect x="30" y="30" width="1020" height="760"/></clipPath>
      <clipPath id="v2"><rect x="30" y="820" width="1020" height="500"/></clipPath>
      <filter id="papel"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .45 0 0 0 0 .35 0 0 0 -1.6 1"/></filter>
    </defs>`;

    // ---- Viñeta 1: explosión ----
    let v1 = `<rect x="30" y="30" width="1020" height="760" fill="url(#benRojoG)"/>`;
    // Líneas de velocidad hacia el centro
    const cx = 560, cy = 440;
    v1 += `<g id="lin">`;
    for (let i = 0; i < 90; i++) {
      const a = (i / 90) * Math.PI * 2 + r() * 0.03, a2 = a + 0.012 + r() * 0.02;
      const R1 = 330 + r() * 80, R2 = 1100;
      v1 += `<polygon points="${cx + Math.cos(a) * R1},${cy + Math.sin(a) * R1} ${cx + Math.cos(a) * R2},${cy + Math.sin(a) * R2} ${cx + Math.cos(a2) * R2},${cy + Math.sin(a2) * R2}" fill="${NEGRO}" opacity=".85"/>`;
    }
    v1 += `</g>`;
    // Estallido de picos
    const estallido = (R, Rin, picos, jit) => {
      const p = [];
      for (let i = 0; i < picos * 2; i++) {
        const a = (i / (picos * 2)) * Math.PI * 2;
        const rad = i % 2 ? Rin * (0.85 + r() * 0.2) : R * (0.8 + r() * jit);
        p.push(`${(cx + Math.cos(a) * rad * 1.25).toFixed(1)},${(cy + Math.sin(a) * rad).toFixed(1)}`);
      }
      return p.join(" ");
    };
    v1 += `<g id="est">`;
    v1 += `<polygon points="${estallido(360, 250, 17, 0.45)}" fill="${ROJO}" stroke="${NEGRO}" stroke-width="9" stroke-linejoin="round"/>`;
    v1 += `<polygon points="${estallido(300, 215, 15, 0.35)}" fill="url(#benRojo)" stroke="${NEGRO}" stroke-width="7" stroke-linejoin="round"/>`;
    v1 += `<polygon points="${estallido(250, 190, 13, 0.25)}" fill="${AMARILLO}" stroke="${NEGRO}" stroke-width="6" stroke-linejoin="round"/>`;
    v1 += `</g>`;
    // Onomatopeya con volumen: capas desplazadas
    const texto = (dx, dy, fill, stroke, sw) => `<text x="${cx + dx}" y="${cy + 70 + dy}" text-anchor="middle" font-family="Anton" font-size="215" letter-spacing="4" transform="rotate(-9 ${cx} ${cy}) skewX(-8)" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" paint-order="stroke">¡QUILLO!</text>`;
    v1 += `<g id="ono">`;
    for (let k = 14; k > 0; k -= 2) v1 += texto(k, k, NEGRO, NEGRO, 16);
    v1 += texto(0, 0, "#fff", NEGRO, 16);
    v1 += `</g>`;
    // Cartucho de narrador
    v1 += `<g id="nar"><g transform="rotate(-1.5 60 60)"><rect x="52" y="52" width="520" height="92" fill="${AMARILLO}" stroke="${NEGRO}" stroke-width="6"/>
      <text x="74" y="92" font-family="Archivo Black" font-size="27" fill="${NEGRO}">MIENTRAS TANTO, EN TRIANA...</text>
      <text x="74" y="126" font-family="Archivo Black" font-size="21" fill="${NEGRO}">¡ALGUIEN DESCUBRE HYPERFRAMES!</text></g></g>`;
    s += `<g clip-path="url(#v1)">${v1}</g><rect x="30" y="30" width="1020" height="760" fill="none" stroke="${NEGRO}" stroke-width="10"/>`;

    // ---- Viñeta 2: el ojo ----
    let v2 = `<rect x="30" y="820" width="1020" height="500" fill="url(#benPiel)"/>`;
    const ox = 640, oy = 1075;
    // Ceja
    v2 += `<path d="M ${ox - 290} ${oy - 150} Q ${ox - 40} ${oy - 250} ${ox + 260} ${oy - 170} Q ${ox - 20} ${oy - 210} ${ox - 290} ${oy - 150} Z" fill="${NEGRO}"/>`;
    // Párpado y ojo
    v2 += `<path d="M ${ox - 300} ${oy} Q ${ox - 30} ${oy - 190} ${ox + 280} ${oy - 20} Q ${ox} ${oy + 140} ${ox - 300} ${oy} Z" fill="#fff" stroke="${NEGRO}" stroke-width="9"/>`;
    v2 += `<clipPath id="ojo"><path d="M ${ox - 300} ${oy} Q ${ox - 30} ${oy - 190} ${ox + 280} ${oy - 20} Q ${ox} ${oy + 140} ${ox - 300} ${oy} Z"/></clipPath>`;
    v2 += `<g clip-path="url(#ojo)"><g id="iris"><circle cx="${ox - 10}" cy="${oy - 30}" r="112" fill="url(#benAzul)" stroke="${NEGRO}" stroke-width="7"/>
      <circle cx="${ox - 10}" cy="${oy - 30}" r="52" fill="${NEGRO}"/>
      <ellipse cx="${ox + 22}" cy="${oy - 70}" rx="26" ry="18" fill="#fff"/><circle cx="${ox - 40}" cy="${oy + 5}" r="9" fill="#fff"/></g>
      <path d="M ${ox - 300} ${oy - 200} L ${ox + 300} ${oy - 200} L ${ox + 300} ${oy - 70} Q ${ox} ${oy - 150} ${ox - 300} ${oy - 40} Z" fill="${NEGRO}" opacity=".12"/><g id="parp"><rect x="${ox - 320}" y="${oy - 460}" width="640" height="270" fill="url(#benPiel)"/><path d="M ${ox - 320} ${oy - 192} L ${ox + 320} ${oy - 192}" stroke="${NEGRO}" stroke-width="10"/></g></g>`;
    // Pestañas
    for (let i = 0; i < 11; i++) {
      const t = i / 10;
      const x = ox - 290 + t * 560, y = oy - 5 - Math.sin(t * Math.PI) * 95;
      const a = -Math.PI / 2 - 0.9 + t * 1.5;
      v2 += `<path d="M ${x} ${y} q ${Math.cos(a) * 30} ${Math.sin(a) * 40} ${Math.cos(a) * 58 + 12} ${Math.sin(a) * 58}" stroke="${NEGRO}" stroke-width="${9 - Math.abs(t - .6) * 6}" fill="none" stroke-linecap="round"/>`;
    }
    // Lágrima
    v2 += `<g id="lag"><path d="M ${ox + 180} ${oy + 40} q -28 50 0 70 q 28 -20 0 -70 Z" fill="#bfe3ff" stroke="${NEGRO}" stroke-width="5"/>`;
    v2 += `<ellipse cx="${ox + 172}" cy="${oy + 88}" rx="5" ry="9" fill="#fff"/></g>`;
    // Bocadillo de pensamiento
    v2 += `<g id="bur"><path d="M 70 860 h 330 a 30 30 0 0 1 30 30 v 150 a 30 30 0 0 1 -30 30 h -180 l -40 60 l 5 -60 h -115 a 30 30 0 0 1 -30 -30 v -150 a 30 30 0 0 1 30 -30 z" fill="#fff" stroke="${NEGRO}" stroke-width="6"/>
      <text font-family="Archivo Black" font-size="31" fill="${NEGRO}"><tspan x="92" y="920">¡¿TODO ESTO</tspan><tspan x="92" y="960">ES CÓDIGO?!</tspan><tspan x="92" y="1010" font-size="24">¡NO ME LO PUEDO</tspan><tspan x="92" y="1042" font-size="24">CREER, QUILLO!</tspan></text></g>`;
    s += `<g clip-path="url(#v2)">${v2}</g><rect x="30" y="820" width="1020" height="500" fill="none" stroke="${NEGRO}" stroke-width="10"/>`;
    // Textura de papel de cómic viejo
    s += `<rect width="1080" height="1350" filter="url(#papel)" opacity=".35" style="mix-blend-mode:multiply"/>`;
    s += `<text x="1040" y="1340" text-anchor="end" font-family="Space Mono" font-size="12" fill="#6b5a3a">Nº 1 · 25 PTS</text>`;
    document.getElementById("s").innerHTML = s;
    // Viñeta 1: el estallido revienta, la onomatopeya salta con temblor y entra el cartucho.
    // Viñeta 2: el ojo mira a un lado y a otro, aparece el bocadillo, parpadea y cae la lágrima.
    const $ = (id) => document.getElementById(id);
    const cl = (u) => Math.min(1, Math.max(0, u));
    const rebote = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : 1 + 2.7 * Math.pow(u - 1, 3) + 1.7 * Math.pow(u - 1, 2));
    const esc = (el, k, x, y, extra = "") => el.setAttribute("transform", `translate(${x} ${y}) scale(${k}) translate(${-x} ${-y}) ${extra}`);
    window.pintar = (t) => {
      const temblor = t > 0.8 && t < 1.6 ? Math.sin(t * 90) * 6 : 0;
      esc($("est"), rebote((t - 0.15) / 0.55) * (1 + 0.025 * Math.sin(t * 12)), cx, cy);
      $("lin").setAttribute("transform", `rotate(${t * 1.5} ${cx} ${cy})`);
      $("lin").setAttribute("opacity", cl(t / 0.4));
      esc($("ono"), rebote((t - 0.75) / 0.5) * (1 + 0.02 * Math.sin(t * 7)), cx, cy + 40, `translate(${temblor} ${-temblor * 0.5})`);
      $("nar").setAttribute("transform", `translate(${-620 * (1 - rebote((t - 1.7) / 0.6))} 0)`);
      // el ojo
      const mira = t < 3 ? 0 : t < 4 ? -38 * cl((t - 3) / 0.25) : t < 5.2 ? -38 + 76 * cl((t - 4) / 0.25) : 38 - 38 * cl((t - 5.2) / 0.3);
      $("iris").setAttribute("transform", `translate(${mira} ${Math.abs(mira) * 0.15})`);
      const parp = Math.max(0, 1 - Math.abs(t - 6.6) / 0.14);
      $("parp").setAttribute("transform", `translate(0 ${parp * 265})`);
      esc($("bur"), rebote((t - 2.4) / 0.5), 230, 1110);
      const ul = t - 7.2;
      $("lag").setAttribute("opacity", ul < 0 ? 0 : cl(1 - (ul - 1.8) / 0.5));
      $("lag").setAttribute("transform", `translate(0 ${ul < 0 ? -20 : Math.min(260, 0.5 * 260 * ul * ul)})`);
    };
    listo();
  </script>
</body>
</html>
