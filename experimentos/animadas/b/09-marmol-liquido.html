<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<script src="../../imagenes/assets/gl.js"></script>
<script src="../comun/trazar-video.js"></script>
<style>body { background: #000; }</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <script>
    // Deformación de dominio: ruido evaluado sobre ruido evaluado sobre ruido.
    // f(p + g(p + h(p))) — sale algo parecido a pintura líquida o ágata.
    // Se ilumina como relieve para que parezca un material con brillo.
    const frag = `
    float h12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    float vn(vec2 p) { vec2 i = floor(p), f = fract(p); vec2 u = f * f * f * (f * (f * 6. - 15.) + 10.);
      return mix(mix(h12(i), h12(i + vec2(1, 0)), u.x), mix(h12(i + vec2(0, 1)), h12(i + vec2(1, 1)), u.x), u.y); }
    const mat2 M = mat2(.8, .6, -.6, .8);
    float fbm(vec2 p) { float s = 0., a = .5; for (int i = 0; i < 6; i++) { s += a * vn(p); p = M * p * 2.02; a *= .5; } return s / .98; }
    float campo(vec2 p, out vec2 q, out vec2 r) {
      q = vec2(fbm(p + vec2(0., 0.) + uT * .025), fbm(p + vec2(5.2, 1.3) - uT * .02));
      r = vec2(fbm(p + 4. * q + vec2(1.7, 9.2) + uT * .06), fbm(p + 4. * q + vec2(8.3, 2.8) - uT * .045));
      return fbm(p + 4. * r);
    }
    vec3 muestra(vec2 px) {
      vec2 p = (px - uRes * .5) / uRes.y * 3.2 + vec2(1.3, .4);
      vec2 q, r;
      float f = campo(p, q, r);
      vec3 col = mix(vec3(.06, .33, .38), vec3(.98, .42, .26), clamp(f * f * 4., 0., 1.));
      col = mix(col, vec3(0., .01, .1), clamp(length(q), 0., 1.));
      col = mix(col, vec3(1., .9, .76), clamp(r.x * r.x, 0., 1.) * .75);
      col *= (f * f * f + .6 * f * f + .5 * f) * 1.7;
      // Venas doradas donde el campo cruza ciertos niveles
      float oro = smoothstep(.465, .49, abs(fract(f * 9.) - .5)) * smoothstep(.3, .6, f);
      col = mix(col, vec3(1., .78, .35) * 1.4, oro * .85);
      // Relieve: normal a partir del gradiente del campo
      float e = .003;
      vec2 q2, r2;
      float fx = campo(p + vec2(e, 0), q2, r2), fy = campo(p + vec2(0, e), q2, r2);
      vec3 n = normalize(vec3(-(fx - f) / e, -(fy - f) / e, 28.));
      vec3 L = normalize(vec3(-.5, .6, .7));
      float dif = clamp(dot(n, L), 0., 1.);
      float spec = pow(clamp(dot(reflect(-L, n), vec3(0, 0, 1)), 0., 1.), 40.);
      col *= .55 + .7 * dif;
      col += vec3(1., .95, .9) * spec * .35;
      return pow(col, vec3(1.3)) * 1.3;
    }`;
    // En el vídeo el mármol fluye: el tiempo desplaza las capas del ruido deformado
    // y las vetas doradas se estiran como pintura que corre.
    trazarVideo({ escala: .67, frag, modo: "anima", porFotograma: 1, franjas: 6, expo: 1.0, vineta: .35, grano: .015, tono: false });
    listo();
  </script>
</body>
</html>
