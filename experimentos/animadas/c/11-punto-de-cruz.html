<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<script src="../comun/celdas.js"></script>
<script src="../../imagenes/assets/mas.js"></script>
<style>body { background: #efe7d4; }</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <script>
    // Dechado de punto de cruz: el diseño es una rejilla de 72×90 celdas
    // y cada celda se borda con dos puntadas cruzadas de hilo con volumen.
    const ctx = canvas2d();
    const r = rng(1950);
    const n = makeNoise(1950);
    const CW = 72, CH = 90, S = 13, OX = 72, OY = 90;
    const HILOS = [null, "#c0262d", "#2f6b3a", "#7fb069", "#b5563c", "#e2a72e", "#283a6b", "#e58fa0", "#5b3a29", "#4a86c5", "#f7f1e3"];
    const rej = Array.from({ length: CH }, () => new Array(CW).fill(0));
    const pon = (x, y, c) => { if (x >= 0 && y >= 0 && x < CW && y < CH) rej[y][x] = c; };

    // Letra de 3×5 píxeles
    const F = {
      A: "010101111101101", B: "110101110101110", C: "011100100100011", D: "110101101101110", E: "111100110100111",
      F: "111100110100100", G: "011100101101011", H: "101101111101101", I: "111010010010111", J: "001001001101010",
      K: "101101110101101", L: "100100100100111", M: "101111111101101", N: "110101101101101", O: "010101101101010",
      P: "110101110100100", Q: "010101101110011", R: "110101110101101", S: "011100010001110", T: "111010010010010",
      U: "101101101101111", V: "101101101101010", W: "101101111111101", X: "101101010101101", Y: "101101010010010",
      Z: "111001010100111", 0: "111101101101111", 2: "110001010100111", 6: "011100110101010", ".": "000000000000010",
    };
    function texto(t, x0, y0, c, esc = 1) {
      [...t].forEach((l, i) => {
        const g = F[l];
        if (!g) return;
        for (let k = 0; k < 15; k++) if (g[k] === "1")
          for (let a = 0; a < esc; a++) for (let b = 0; b < esc; b++) pon(x0 + i * 4 * esc + (k % 3) * esc + a, y0 + Math.floor(k / 3) * esc + b, c);
      });
    }
    const ancho = (t, esc = 1) => t.length * 4 * esc - esc;
    const dibujo = (filas, x0, y0, mapa) => filas.forEach((f, j) => [...f].forEach((ch, i) => mapa[ch] && pon(x0 + i, y0 + j, mapa[ch])));

    // Marco y cenefas
    for (let x = 1; x < CW - 1; x++) { pon(x, 1, 6); pon(x, CH - 2, 6); }
    for (let y = 1; y < CH - 1; y++) { pon(1, y, 6); pon(CW - 2, y, 6); }
    for (let x = 3; x < CW - 3; x++) {
      const z = x % 6 < 3 ? x % 6 : 5 - (x % 6);
      pon(x, 3 + z, 1);
      pon(x, CH - 4 - z, 1);
    }
    texto("HOGAR", Math.floor((CW - ancho("HOGAR", 2)) / 2), 9, 6, 2);
    texto("ABCDEFGHIJKLM", Math.floor((CW - ancho("ABCDEFGHIJKLM")) / 2), 22, 2);
    texto("NOPQRSTUVWXYZ", Math.floor((CW - ancho("NOPQRSTUVWXYZ")) / 2), 29, 9);
    const corazon = ["01010", "11111", "11111", "01110", "00100"];
    for (let i = 0; i < 10; i++) dibujo(corazon, 6 + i * 6, 36, { 1: [1, 7, 5][i % 3] });

    // Maceta con claveles y dos pajaritos
    const maceta = ["11111111111111111111", "22222222222222222222", ".111111111111111111.", ".111111111111111111.", "..1111111111111111..", "..1111111111111111..", "...11111111111111...", "...11111111111111...", "....111111111111....", "....111111111111...."];
    dibujo(maceta, 26, 66, { 1: 4, 2: 8 });
    const tallos = [[30, 50], [34, 44], [36, 55], [40, 46], [42, 52], [37, 60]];
    for (const [x, top] of tallos) {
      for (let y = top + 3; y < 66; y++) pon(x + Math.round(Math.sin(y * 0.4 + x) * 0.6), y, 2);
      for (let k = 0; k < 3; k++) { pon(x - 1 - k, top + 8 + k, 3); pon(x + 1 + k, top + 12 + k, 3); }
      dibujo(["01110", "11711", "17171", "11111", "01010"], x - 2, top - 1, { 1: 1, 7: 7 });
    }
    const pajaro = ["..66...", ".6696..", "66666.5", ".6666..", "..8.8.."];
    dibujo(pajaro, 12, 58, { 6: 9, 9: 10, 5: 5, 8: 8 });
    dibujo(pajaro.map((f) => [...f].reverse().join("")), 53, 58, { 6: 9, 9: 10, 5: 5, 8: 8 });
    for (let x = 8; x < 64; x++) if (x < 25 || x > 46) pon(x, 76, 3);
    texto("2026", Math.floor((CW - ancho("2026")) / 2), 79, 1);
    texto("Q.C.", 8, 79, 8);
    texto("C.H.", CW - 8 - ancho("C.H."), 79, 8);

    // --- Tela de Aida ---
    M.porPixel(ctx, (x, y) => {
      const u = ((x - OX) / S) % 1, v = ((y - OY) / S) % 1;
      const uu = (u + 1) % 1, vv = (v + 1) % 1;
      const hueco = Math.min(uu, 1 - uu) < 0.12 && Math.min(vv, 1 - vv) < 0.12;
      const tejido = 0.93 + 0.07 * Math.sin(uu * Math.PI) * Math.sin(vv * Math.PI) + (n(x * 0.8, y * 0.1, 1) - 0.5) * 0.06;
      const k = hueco ? 0.72 : tejido;
      const m = 0.97 + (n(x * 0.004, y * 0.004, 3) - 0.5) * 0.08;
      return [239 * k * m, 231 * k * m, 212 * k * m];
    });

    // Puntada: un hilo diagonal con degradado, torsión y sombra
    function puntada(cx, cy, ang, col) {
      const base = M.hex(col);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(ang);
      const L = S * 1.32, A = S * 0.4;
      ctx.shadowColor = "rgba(40,25,10,.4)";
      ctx.shadowBlur = 2;
      ctx.shadowOffsetX = 0.8;
      ctx.shadowOffsetY = 1.2;
      const g = ctx.createLinearGradient(0, -A / 2, 0, A / 2);
      g.addColorStop(0, M.rgb(base.map((c) => c * 0.55)));
      g.addColorStop(0.35, M.rgb(base.map((c) => Math.min(255, c * 1.12 + 18))));
      g.addColorStop(0.6, M.rgb(base));
      g.addColorStop(1, M.rgb(base.map((c) => c * 0.5)));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.roundRect(-L / 2, -A / 2, L, A, A / 2);
      ctx.fill();
      ctx.shadowColor = "transparent";
      ctx.strokeStyle = M.rgb(base.map((c) => c * 0.62), 0.55);
      ctx.lineWidth = 0.7;
      for (let t = -L / 2 + 2; t < L / 2 - 1; t += 2.4) {
        ctx.beginPath();
        ctx.moveTo(t, -A / 2 + 0.8);
        ctx.lineTo(t + 2, A / 2 - 0.8);
        ctx.stroke();
      }
      ctx.restore();
    }
    for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
      const c = rej[y][x];
      if (!c) continue;
      const cx = OX + (x + 0.5) * S + (r() - 0.5) * 0.6, cy = OY + (y + 0.5) * S + (r() - 0.5) * 0.6;
      puntada(cx, cy, -Math.PI / 4 + (r() - 0.5) * 0.06, HILOS[c]);
      puntada(cx, cy, Math.PI / 4 + (r() - 0.5) * 0.06, HILOS[c]);
    }
    // Pespunte oscuro alrededor de la maceta y los pájaros
    ctx.strokeStyle = "#3a261c";
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    const contorno = (c) => {
      for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
        if (!c.includes(rej[y][x])) continue;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const v = (rej[y + dy] || [])[x + dx];
          if (c.includes(v)) continue;
          const x0 = OX + (x + (dx > 0 ? 1 : 0)) * S, y0 = OY + (y + (dy > 0 ? 1 : 0)) * S;
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.lineTo(x0 + (dy ? S : 0), y0 + (dx ? S : 0));
          ctx.stroke();
        }
      }
    };
    contorno([4, 8]);
    contorno([9, 10, 5]);
    // En el vídeo la pieza se hace celda a celda, en el orden de su oficio.
    revelarPorCeldas({ cw: 13, ch: 13, ox: 72, oy: 90, cols: 72, filas: 90, orden: 'zigzag', base: null, tenue: 0.16 }); listo();
  </script>
</body>
</html>
