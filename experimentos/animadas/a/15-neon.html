<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<style>
  body {
    background:
      radial-gradient(ellipse at 50% 40%, rgba(255, 60, 150, .18), transparent 60%),
      linear-gradient(90deg, rgba(0,0,0,.35) 3px, transparent 3px) 0 0 / 120px 60px,
      linear-gradient(90deg, rgba(0,0,0,.35) 3px, transparent 3px) 60px 30px / 120px 60px,
      linear-gradient(rgba(0,0,0,.4) 3px, transparent 3px) 0 0 / 60px 30px,
      #3a1d1a;
  }
  .luzpared { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(255, 60, 150, .25), transparent 55%); }
  .sombra { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(5,0,10,.85) 90%); }
  .neon { position: absolute; width: 100%; text-align: center; }
  .bar { top: 360px; white-space: nowrap; font-family: "Pacifico"; font-size: 170px; color: #fff0f8; text-shadow: 0 0 6px #fff, 0 0 18px #ff2d95, 0 0 42px #ff2d95, 0 0 90px #ff2d95, 0 0 160px #ff2d95; transform: rotate(-6deg); }
  .sub { top: 720px; font-family: "Monoton"; font-size: 64px; color: #e6fffd; text-shadow: 0 0 6px #fff, 0 0 20px #19f0ff, 0 0 50px #19f0ff, 0 0 100px #19f0ff; letter-spacing: 4px; line-height: 1.3; }
  .flecha { top: 1000px; font-family: "Monoton"; font-size: 120px; color: #fffbe0; text-shadow: 0 0 8px #fff, 0 0 26px #ffd400, 0 0 60px #ffd400; }
  .tubo { position: absolute; left: 150px; right: 150px; height: 8px; border-radius: 8px; background: #fff; box-shadow: 0 0 10px #fff, 0 0 30px #19f0ff, 0 0 60px #19f0ff; }
</style>
</head>
<body>
  <div class="tubo" id="t1" style="top:250px"></div>
  <div class="neon bar" id="bar">Bar Manol<span id="o">o</span></div>
  <div class="neon sub" id="sub">ABIERTO HASTA<br />QUE EL CUERPO<br />AGUANTE</div>
  <div class="neon flecha"><span id="f1">→</span> <span id="f2">←</span></div>
  <div class="tubo" id="t2" style="top:1180px;box-shadow:0 0 10px #fff,0 0 30px #ff2d95,0 0 60px #ff2d95"></div>
  <div class="luzpared" id="luz"></div>
  <div class="sombra"></div>
  <script>
    // Encendido de cartel de neón: cada tubo arranca con sus parpadeos, las flechas se alternan
    // y la última «o» de Manolo está medio fundida, como todos los carteles de bar que se precien.
    const ruido = (k, s) => { const x = Math.sin(k * 12.9898 + s * 78.233) * 43758.5453; return x - Math.floor(x); };
    const tubo = (t, t0, s) => {
      if (t < t0) return 0;
      const u = t - t0;
      if (u > 0.9) return 1;
      return ruido(Math.floor(u * 30), s) > 0.45 ? 1 : 0.08;
    };
    window.pintar = (t) => {
      const v = { t1: tubo(t, 0.3, 1), bar: tubo(t, 0.9, 2), sub: tubo(t, 2.0, 3), t2: tubo(t, 2.6, 4) };
      for (const k in v) document.getElementById(k).style.opacity = 0.06 + 0.94 * v[k];
      const flechas = t > 3.4 ? (Math.floor(t * 2.5) % 2) : -1;
      document.getElementById("f1").style.opacity = flechas === -1 ? 0.06 : flechas === 0 ? 1 : 0.15;
      document.getElementById("f2").style.opacity = flechas === -1 ? 0.06 : flechas === 1 ? 1 : 0.15;
      const o = t > 4.5 && ruido(Math.floor(t * 18), 9) < 0.3 ? 0.15 : 1;
      document.getElementById("o").style.opacity = o;
      document.getElementById("luz").style.opacity = 0.2 + 0.8 * (v.bar * 0.7 + v.sub * 0.3) * (0.97 + 0.03 * Math.sin(t * 60));
    };
    listo();
  </script>
</body>
</html>
