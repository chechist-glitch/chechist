<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<style>
  body { background: radial-gradient(#3a1f5d, #140a24); display: flex; align-items: center; justify-content: center; }
  .escena { perspective: 2200px; }
  .reverso { position: absolute; inset: 0; border-radius: 34px; background: repeating-linear-gradient(45deg, #3a1f5d 0 20px, #4b2a75 20px 40px); border: 18px solid #f4e8cf; backface-visibility: hidden; transform: rotateY(180deg); }
  .reverso::after { content: "✶"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 260px; color: #e0a526; }
  .cara { position: absolute; inset: 0; backface-visibility: hidden; }
  .carta { position: relative; transform-style: preserve-3d; width: 800px; height: 1200px; border-radius: 34px; }
  .cara { background: #f4e8cf; border-radius: 34px; box-shadow: 0 40px 90px rgba(0,0,0,.6); }
  .marco { position: absolute; inset: 30px; border: 5px solid #b8862b; border-radius: 16px; }
  .marco::after { content: ""; position: absolute; inset: 12px; border: 2px solid #b8862b; border-radius: 10px; }
  .num { position: absolute; top: 70px; left: 0; right: 0; text-align: center; font-family: "Playfair"; font-weight: 900; font-size: 64px; color: #3a1f5d; letter-spacing: .2em; }
  .nombre { position: absolute; bottom: 70px; left: 70px; right: 70px; text-align: center; font-family: "Playfair"; font-weight: 900; font-size: 70px; color: #f4e8cf; background: #3a1f5d; padding: 14px 0 20px; border-radius: 8px; letter-spacing: .08em; }
  svg { position: absolute; left: 30px; top: 170px; }
</style>
</head>
<body>
  <div class="escena"><div class="carta" id="carta">
    <div class="cara">
    <div class="marco"></div>
    <div class="num">XIX</div>
    <svg id="s" width="740" height="820" viewBox="0 0 740 820"></svg>
    <div class="nombre">EL QUILLO</div>
    </div>
    <div class="reverso"></div>
  </div></div>
  <script>
    const cx = 370, cy = 360;
    let o = `<g id="rayos">`;
    // Rayos alternos rectos y ondulados
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2, largo = i % 2 ? 300 : 250;
      const x1 = cx + Math.cos(a) * 150, y1 = cy + Math.sin(a) * 150, x2 = cx + Math.cos(a) * largo, y2 = cy + Math.sin(a) * largo;
      if (i % 2) o += `<path d="M${cx + Math.cos(a - .09) * 150} ${cy + Math.sin(a - .09) * 150} L${x2} ${y2} L${cx + Math.cos(a + .09) * 150} ${cy + Math.sin(a + .09) * 150}Z" fill="#e0a526" stroke="#3a1f5d" stroke-width="3"/>`;
      else {
        const nx = -Math.sin(a) * 14, ny = Math.cos(a) * 14;
        o += `<path d="M${x1} ${y1} C${(x1 * 2 + x2) / 3 + nx} ${(y1 * 2 + y2) / 3 + ny} ${(x1 + x2 * 2) / 3 - nx} ${(y1 + y2 * 2) / 3 - ny} ${x2} ${y2}" stroke="#c0392b" stroke-width="7" fill="none" stroke-linecap="round"/>`;
      }
    }
    o += `</g><g id="cara">`;
    // Cara del sol
    o += `<circle cx="${cx}" cy="${cy}" r="150" fill="#f2c14e" stroke="#3a1f5d" stroke-width="5"/>`;
    o += `<path d="M${cx - 80} ${cy - 30} q30 -26 60 0" stroke="#3a1f5d" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    o += `<path d="M${cx + 20} ${cy - 30} q30 -26 60 0" stroke="#3a1f5d" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    o += `<path d="M${cx - 50} ${cy - 5} q20 12 40 0 M${cx + 10} ${cy - 5} q20 12 40 0" stroke="#3a1f5d" stroke-width="4" fill="none"/>`;
    o += `<path d="M${cx} ${cy - 15} q-14 40 0 50" stroke="#3a1f5d" stroke-width="4" fill="none"/>`;
    o += `<path d="M${cx - 55} ${cy + 60} q55 45 110 0" stroke="#3a1f5d" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    o += `<circle cx="${cx - 85}" cy="${cy + 40}" r="20" fill="#e07a5f" opacity=".6"/><circle cx="${cx + 85}" cy="${cy + 40}" r="20" fill="#e07a5f" opacity=".6"/>`;
    // Gafas de sol, que es andaluz
    o += `<path d="M${cx - 105} ${cy - 25} h90 q0 50 -45 50 q-45 0 -45 -50Z M${cx + 15} ${cy - 25} h90 q0 50 -45 50 q-45 0 -45 -50Z M${cx - 15} ${cy - 20} h30" fill="#1b1b2f" stroke="#1b1b2f" stroke-width="6"/>`;
    o += `<path id="brillo" d="M${cx - 90} ${cy - 15} l20 0 M${cx + 30} ${cy - 15} l20 0" stroke="#fff" stroke-width="5" opacity=".7"/>`;
    o += `</g>`;
    // Paisaje: sombrilla y olas
    o += `<clipPath id="mar"><rect width="740" height="820"/></clipPath><g clip-path="url(#mar)">`;
    o += `<path id="ola1" d="M-740 680 Q -650 640 -555 680 T -370 680 T -185 680 T 0 680 T 185 680 T 370 680 T 555 680 T 740 680 T 925 680 T 1110 680 V820 H-740Z" fill="#2a6f97"/>`;
    o += `<path id="ola2" d="M-740 720 Q -650 690 -555 720 T -370 720 T -185 720 T 0 720 T 185 720 T 370 720 T 555 720 T 740 720 T 925 720 T 1110 720 V820 H-740Z" fill="#1d4e89"/></g>`;
    o += `<path d="M150 690 L150 560" stroke="#3a1f5d" stroke-width="6"/><path d="M60 580 Q150 480 240 580Z" fill="#c0392b" stroke="#3a1f5d" stroke-width="4"/><path d="M90 580 Q150 500 150 580 M210 580 Q150 500 150 580" stroke="#f4e8cf" stroke-width="4" fill="none"/>`;
    for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2; o += `<circle cx="${370 + Math.cos(a) * 345}" cy="${360 + Math.sin(a) * 345}" r="5" fill="#b8862b"/>`; }
    document.getElementById("s").innerHTML = o;
    // La carta se da la vuelta como si la sacaran del mazo; luego el sol gira sus rayos,
    // el mar se mueve, a las gafas les da un reflejo y la carta flota un poco.
    const ease = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
    window.pintar = (t) => {
      const giro = 180 * (1 - ease((t - 0.4) / 1.6));
      const flota = Math.sin(t * 1.3) * 10;
      document.getElementById("carta").style.transform = `translateY(${flota}px) rotateY(${giro}deg) rotateZ(${Math.sin(t * 0.9) * 1.2}deg)`;
      document.getElementById("rayos").setAttribute("transform", `rotate(${t * 9} ${cx} ${cy})`);
      document.getElementById("cara").setAttribute("transform", `translate(${cx} ${cy}) scale(${1 + 0.02 * Math.sin(t * 2.6)}) translate(${-cx} ${-cy})`);
      document.getElementById("ola1").setAttribute("transform", `translate(${(t * 37) % 370} 0)`);
      document.getElementById("ola2").setAttribute("transform", `translate(${-(t * 55) % 370} ${Math.sin(t * 1.7) * 4})`);
      const b = Math.max(0, 1 - Math.abs(t - 5.5) / 0.35);
      document.getElementById("brillo").setAttribute("opacity", 0.7 + 0.3 * b);
      document.getElementById("brillo").setAttribute("stroke-width", 5 + 6 * b);
    };
    listo();
  </script>
</body>
</html>
