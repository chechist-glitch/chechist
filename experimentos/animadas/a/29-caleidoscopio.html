<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<style>
  body { background: #0a0a12; }
  .t { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-family: "Monoton"; font-size: 70px; color: #fff; }
  .t small { display: block; font-family: "Space Mono"; font-size: 20px; color: #9aa; margin-top: 8px; }
</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <div class="t">CALEIDOSCOPIO<small>una cuña de formas al azar · reflejada 16 veces</small></div>
  <script>
    const ctx = canvas2d();
    const r = rng(616);
    const cuña = document.createElement("canvas");
    const RAD = 480, SEG = 16, ANG = (Math.PI * 2) / SEG;
    cuña.width = RAD; cuña.height = RAD;
    const g = cuña.getContext("2d");
    const pal = ["#f72585", "#b5179e", "#7209b7", "#4361ee", "#4cc9f0", "#ffd60a", "#fb5607", "#ffffff"];
    // Las piezas de cristal de la cuña se deslizan despacio (como cuando giras el tubo)
    // y todo el caleidoscopio da media vuelta; la simetría de 16 se mantiene en cada fotograma.
    const formas = [];
    for (let i = 0; i < 160; i++) {
      formas.push({ d: r() * RAD, a: (r() * 3 - 1) * ANG, c: pal[Math.floor(r() * pal.length)], al: 0.25 + r() * 0.55, s: 6 + r() * 50, tipo: r(), rot: r() * Math.PI, v: (0.4 + r()) * (r() < 0.5 ? 1 : -1), vd: (r() - 0.5) * 30 });
    }
    window.pintar = (t) => {
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
      g.clearRect(0, 0, RAD, RAD);
      g.globalCompositeOperation = "lighter";
      for (const f of formas) {
        const a = f.a + f.v * t * 0.022, d = f.d + f.vd * Math.sin(t * 0.5);
        const x = Math.cos(a) * d, y = Math.sin(a) * d;
        g.fillStyle = f.c; g.globalAlpha = f.al;
        g.beginPath();
        if (f.tipo < 0.4) g.arc(x, y, f.s / 2, 0, Math.PI * 2);
        else if (f.tipo < 0.7) { g.moveTo(x, y - f.s); g.lineTo(x + f.s * .6, y); g.lineTo(x, y + f.s); g.lineTo(x - f.s * .6, y); }
        else g.ellipse(x, y, f.s, f.s / 5, f.rot + t * 0.3, 0, Math.PI * 2);
        g.fill();
      }
      ctx.fillStyle = "#0a0a12"; ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.translate(540, 600);
      ctx.rotate(t * Math.PI / 20);
      for (let k = 0; k < SEG; k++) {
        ctx.save();
        ctx.rotate(k * ANG);
        if (k % 2) { ctx.scale(1, -1); ctx.rotate(-ANG); }
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, RAD, 0, ANG + 0.004); ctx.closePath(); ctx.clip();
        ctx.drawImage(cuña, 0, 0);
        ctx.restore();
      }
      ctx.restore();
      const brillo = ctx.createRadialGradient(540, 600, 0, 540, 600, 500);
      brillo.addColorStop(0, "rgba(255,255,255,.25)"); brillo.addColorStop(.25, "rgba(255,255,255,0)");
      ctx.fillStyle = brillo; ctx.fillRect(0, 0, W, H);
    };
    listo();
  </script>
</body>
</html>
