<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<style>
  body { background: #f5e6d8; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(110px); }
  .grano { position: absolute; inset: 0; opacity: .55; mix-blend-mode: overlay; }
  h1 { position: absolute; left: 0; right: 0; top: 500px; text-align: center; font-family: "DM Serif"; font-style: italic; font-size: 260px; color: #fffaf3; letter-spacing: -6px; mix-blend-mode: soft-light; }
  h1.sombra { mix-blend-mode: normal; color: rgba(255, 250, 243, .85); }
  p { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font-family: "Space Mono"; font-size: 24px; letter-spacing: .4em; color: #3b2a3f; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="blob" style="left:-150px;top:-100px;width:800px;height:800px;background:#ff7a59"></div>
  <div class="blob" style="left:450px;top:150px;width:750px;height:750px;background:#b28dff"></div>
  <div class="blob" style="left:-100px;top:700px;width:700px;height:700px;background:#ffd166"></div>
  <div class="blob" style="left:500px;top:850px;width:800px;height:700px;background:#06d6a0"></div>
  <div class="blob" style="left:250px;top:450px;width:500px;height:400px;background:#ef476f"></div>
  <h1 class="sombra" id="h">respira</h1>
  <p>gradientes borrosos + grano de película</p>
  <svg class="grano" width="1080" height="1350">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch" seed="9" id="tu" /><feColorMatrix type="saturate" values="0" /></filter>
    <rect width="100%" height="100%" filter="url(#n)" />
  </svg>
  <script>
    // «Respira» de verdad: las manchas de color se mueven despacio y se hinchan y deshinchan
    // a ritmo de respiración (4 s inspirar, 4 s soltar), el grano cambia en cada fotograma.
    const blobs = [...document.querySelectorAll(".blob")];
    const fase = [0, 1.7, 3.1, 4.4, 2.2];
    window.pintar = (t) => {
      const resp = 0.5 - 0.5 * Math.cos((t / 5) * Math.PI * 2);
      blobs.forEach((b, i) => {
        const dx = Math.sin(t * 0.35 + fase[i]) * 90, dy = Math.cos(t * 0.28 + fase[i] * 1.3) * 70;
        b.style.transform = `translate(${dx}px, ${dy}px) scale(${0.9 + 0.2 * resp + 0.05 * Math.sin(t + i)})`;
      });
      const h = document.getElementById("h");
      h.style.transform = `scale(${0.97 + 0.06 * resp})`;
      h.style.letterSpacing = `${-6 + 10 * resp}px`;
      document.getElementById("tu").setAttribute("seed", 9 + Math.floor(t * 24));
    };
    listo();
  </script>
</body>
</html>
