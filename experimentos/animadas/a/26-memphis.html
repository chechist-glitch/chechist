<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<style>
  body { background: #fdf0d5; }
  svg { position: absolute; inset: 0; }
  .t { position: absolute; left: 140px; right: 140px; top: 480px; padding: 40px 30px; background: #fff; border: 8px solid #111; box-shadow: 20px 20px 0 #111; text-align: center; transform: rotate(-3deg); }
  .t h1 { font-family: "Rubik Mono"; font-size: 84px; line-height: 1; color: #111; }
  .t p { font-family: "Pacifico"; font-size: 56px; color: #ff5d8f; margin-top: 8px; }
</style>
</head>
<body>
  <svg id="s" width="1080" height="1350"></svg>
  <div class="t" id="t"><h1>MEMPHIS</h1><p>del Polígono Sur</p></div>
  <script>
    const r = rng(1981);
    const cols = ["#ff5d8f", "#00bbf9", "#fee440", "#00f5d4", "#9b5de5", "#111"];
    const c = () => cols[Math.floor(r() * cols.length)];
    let o = `<defs><pattern id="pt" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="3.5" fill="#111"/></pattern>
      <pattern id="rz" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="18" fill="#111"/></pattern></defs>`;
    for (let i = 0; i < 46; i++) {
      const x = r() * 1080, y = r() * 1350, s = 30 + r() * 90, rot = r() * 360;
      const t = Math.floor(r() * 7);
      const g = `class="f" data-x="${x}" data-y="${y}" data-r="${rot}" transform="translate(${x} ${y}) rotate(${rot})"`;
      if (t === 0) o += `<path ${g} d="M${-s} 0 q${s / 4} ${-s / 2} ${s / 2} 0 t${s / 2} 0 t${s / 2} 0 t${s / 2} 0" stroke="${c()}" stroke-width="12" fill="none" stroke-linecap="round"/>`;
      else if (t === 1) o += `<polygon ${g} points="0,${-s} ${s * .87},${s / 2} ${-s * .87},${s / 2}" fill="${c()}" stroke="#111" stroke-width="6"/>`;
      else if (t === 2) o += `<circle ${g} r="${s / 2}" fill="url(#pt)"/>`;
      else if (t === 3) o += `<rect ${g} x="${-s / 2}" y="${-s / 5}" width="${s}" height="${s / 2.5}" fill="url(#rz)"/>`;
      else if (t === 4) o += `<path ${g} d="M${-s} 0 l${s / 3} ${-s / 3} l${s / 3} ${s / 3} l${s / 3} ${-s / 3} l${s / 3} ${s / 3} l${s / 3} ${-s / 3} l${s / 3} ${s / 3}" stroke="${c()}" stroke-width="10" fill="none" stroke-linejoin="round"/>`;
      else if (t === 5) o += `<circle ${g} r="${s / 3}" fill="${c()}" stroke="#111" stroke-width="6"/>`;
      else o += `<path ${g} d="M${-s / 2} 0 a${s / 2} ${s / 2} 0 0 1 ${s} 0" fill="none" stroke="${c()}" stroke-width="14"/>`;
    }
    document.getElementById("s").innerHTML = o;
    // Las formas entran saltando, giran y flotan cada una a su ritmo; el cartel llega de golpe
    // y se queda bailando un poco. Puro Memphis de los 80.
    const fs = [...document.querySelectorAll(".f")];
    const rebote = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : 1 + 2.7 * Math.pow(u - 1, 3) + 1.7 * Math.pow(u - 1, 2));
    const vel = fs.map((_, i) => ({ v: (i % 2 ? 1 : -1) * (8 + (i * 37) % 23), f: (i * 1.37) % 6.28, d: 0.1 + (i * 0.061) % 2 }));
    window.pintar = (t) => {
      fs.forEach((el, i) => {
        const p = vel[i];
        const k = rebote((t - p.d) / 0.6);
        const x = +el.dataset.x + Math.sin(t * 0.8 + p.f) * 14, y = +el.dataset.y + Math.cos(t * 0.7 + p.f) * 18;
        el.setAttribute("transform", `translate(${x} ${y}) rotate(${+el.dataset.r + p.v * t}) scale(${k})`);
      });
      const u = rebote((t - 2.2) / 0.7);
      document.getElementById("t").style.transform = `rotate(${-3 + Math.sin(t * 2.2) * 1.5 * (t > 2.9 ? 1 : 0)}deg) scale(${u})`;
    };
    listo();
  </script>
</body>
</html>
