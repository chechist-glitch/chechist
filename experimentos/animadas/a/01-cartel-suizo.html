<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<style>
  body { background: #efebe1; color: #111; }
  .rejilla { position: absolute; inset: 0; background-image: linear-gradient(90deg, rgba(0,0,0,.08) 1px, transparent 1px); background-size: 90px 100%; animation: aparece 1s both; }
  .rojo { position: absolute; left: 540px; top: 0; width: 540px; height: 820px; background: #e3261c; transform-origin: top; animation: cae 1.1s .3s cubic-bezier(.7,0,.2,1) both; }
  .circulo { position: absolute; left: 610px; top: 140px; width: 400px; height: 400px; border-radius: 50%; background: #111; animation: rebota 1s 1.1s cubic-bezier(.3,1.6,.5,1) both, deriva 7.9s 2.1s ease-in-out both; }
  .palabra { position: absolute; left: 60px; font-family: "Anton"; font-size: 410px; line-height: .8; letter-spacing: -8px; text-transform: uppercase; overflow: hidden; }
  .palabra span { display: block; }
  .p1 { top: 70px; }
  .p1 span { animation: sube 0.9s 1.6s cubic-bezier(.2,.8,.2,1) both; }
  .p2 { top: 400px; color: #efebe1; mix-blend-mode: difference; }
  .p2 span { animation: sube 0.9s 1.85s cubic-bezier(.2,.8,.2,1) both; }
  .info { position: absolute; left: 60px; bottom: 60px; width: 960px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 30px; font-size: 22px; line-height: 1.35; padding-top: 22px; }
  .info::before { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 6px; background: #111; transform-origin: left; animation: raya 1.2s 2.4s cubic-bezier(.7,0,.2,1) both; }
  .info > div { animation: entra .7s both; }
  .info > div:nth-child(1) { animation-delay: 3s; }
  .info > div:nth-child(2) { animation-delay: 3.25s; }
  .info > div:nth-child(3) { animation-delay: 3.5s; }
  .info b { display: block; font-weight: 800; font-size: 26px; margin-bottom: 6px; }
  .num { position: absolute; right: 60px; top: 870px; font-family: "Anton"; font-size: 150px; line-height: 1; color: #e3261c; font-variant-numeric: tabular-nums; }
  @keyframes aparece { from { opacity: 0; } }
  @keyframes cae { from { transform: scaleY(0); } }
  @keyframes rebota { from { transform: scale(0); } }
  @keyframes deriva { 0% { translate: 0 0; } 50% { translate: -260px 180px; } 100% { translate: 0 0; } }
  @keyframes sube { from { transform: translateY(105%); } }
  @keyframes raya { from { transform: scaleX(0); } }
  @keyframes entra { from { opacity: 0; transform: translateY(24px); } }
</style>
</head>
<body>
  <div class="rejilla"></div>
  <div class="rojo"></div>
  <div class="circulo"></div>
  <div class="palabra p1"><span>Sevi</span></div>
  <div class="palabra p2"><span>lla</span></div>
  <div class="num" id="num">0°N</div>
  <div class="info">
    <div><b>Estilo suizo</b>Rejilla, tipografía enorme y rojo. Nada más.</div>
    <div><b>Técnica</b>CSS puro: bloques, un círculo y mix-blend-mode.</div>
    <div><b>Temperatura</b>Agosto. No preguntes.</div>
  </div>
  <script>
    // el número cuenta hasta 41 y luego el termómetro sigue subiendo un poco, que es Sevilla
    window.pintar = (t) => {
      const u = Math.min(1, Math.max(0, (t - 2.2) / 1.6));
      let v = Math.round(41 * (1 - Math.pow(1 - u, 3)));
      document.getElementById("num").textContent = v + "°N";
    };
    listo();
  </script>
</body>
</html>
