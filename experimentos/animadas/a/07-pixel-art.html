<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<style>
  body { background: #000; }
  canvas.full { image-rendering: pixelated; }
  .t { position: absolute; top: 70px; width: 100%; text-align: center; font-family: "Pixel"; font-size: 56px; color: #fff; text-shadow: 6px 6px 0 #b83b5e; line-height: 1.4; }
  .t small { display: block; font-size: 22px; color: #ffe8a3; text-shadow: 3px 3px 0 #6a2c70; }
</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <div class="t"><span id="tit">PUEBLO BLANCO</span><small id="start">PULSA START PARA LA SIESTA</small></div>
  <script>
    // Pixel art a 12 fps: nubes que pasan, pájaros, el sol que baja, ventanas que se encienden
    // y una naranja que se cae. Todo en la rejilla de 72×90 píxeles gordos.
    const P = 15, GW = 72, GH = 90;
    const ctx = canvas2d();
    const px = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x) * P, Math.round(y) * P, P, P); };
    const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x) * P, Math.round(y) * P, w * P, h * P); };
    const cielo = ["#2b1b54", "#6a2c70", "#b83b5e", "#f08a5d", "#f9c56b", "#ffe8a3"];
    const r0 = rng(1492);
    const casas = [];
    for (let fila = 0; fila < 4; fila++) {
      let x = -2 + fila * 3;
      while (x < GW) {
        const w = 7 + Math.floor(r0() * 6), h = 6 + Math.floor(r0() * 5);
        casas.push({ x, y: 50 + fila * 9 - h, w, h });
        x += w + Math.floor(r0() * 2);
      }
    }
    const r = rng(1492);
    for (let k = 0; k < 4; k++) for (let x = -2; x < GW;) { const w = 7 + Math.floor(r() * 6); r(); x += w + Math.floor(r() * 2); }
    for (const c of casas) { c.puerta = c.x + 1 + Math.floor(r() * (c.w - 3)); c.pc = r() < 0.5 ? "#2456a6" : "#2f7d5b"; c.luz = 3 + r() * 6; }
    const nubes = [[8, 12, 9], [40, 7, 12], [62, 16, 7], [-10, 20, 10]];
    window.pintar = (t) => {
      const T = Math.floor(t * 12) / 12;
      const oscuro = Math.min(1, T / 10);
      for (let y = 0; y < 52; y++) {
        const f = Math.min(cielo.length - 1, y / 52 * (cielo.length - 1) - oscuro * 0.9);
        const i = Math.max(0, Math.floor(f)), frac = f - i;
        for (let x = 0; x < GW; x++) px(x, y, (x + y) % 2 === 0 && frac > 0.5 ? cielo[Math.min(i + 1, cielo.length - 1)] : cielo[i]);
      }
      // nubes de píxel que cruzan
      for (const [x0, y0, w] of nubes) {
        const x = ((x0 + T * 1.6 + 20) % (GW + 30)) - 20;
        rect(x, y0, w, 2, "#f9d7c6"); rect(x + 2, y0 - 1, w - 4, 1, "#f9d7c6"); rect(x + 1, y0 + 2, w - 2, 1, "#e9a19a");
      }
      // sol bajando
      const sy = 40 + Math.floor(T * 0.5);
      for (let y = -9; y <= 9; y++) for (let x = -9; x <= 9; x++) if (x * x + y * y <= 81 && sy + y < 52) px(52 + x, sy + y, y > 3 && (y + Math.floor(T * 2)) % 2 === 0 ? "#f08a5d" : "#fff3b0");
      for (let x = 0; x < GW; x++) { const h = 44 + Math.round(Math.sin(x * 0.15) * 3 + Math.sin(x * 0.05 + 1) * 4); rect(x, h, 1, 60 - h, "#3d2352"); }
      rect(0, 60, GW, 30, "#d9b77a");
      // pájaros en uve
      for (let b = 0; b < 3; b++) {
        const bx = -6 + T * 7 + b * 4, by = 26 + b * 2 + Math.sin(T * 3 + b) * 1;
        const ala = Math.floor(T * 6 + b) % 2;
        px(bx, by, "#2b1b54"); px(bx - 1, by - ala, "#2b1b54"); px(bx + 1, by - ala, "#2b1b54");
      }
      for (const c of casas) {
        rect(c.x, c.y, c.w, c.h, "#f4f1ea");
        rect(c.x + c.w - 1, c.y, 1, c.h, "#cfc8ba");
        rect(c.x - 1, c.y - 1, c.w + 2, 1, "#b5532e");
        rect(c.puerta, c.y + c.h - 3, 2, 3, c.pc);
        if (c.w > 8) { rect(c.x + c.w - 4, c.y + 2, 2, 2, T > c.luz ? "#ffd75e" : "#2456a6"); px(c.x + c.w - 4, c.y + 4, "#d63447"); px(c.x + c.w - 3, c.y + 4, "#3f8f3a"); }
      }
      rect(30, 22, 7, 30, "#f4f1ea"); rect(36, 22, 1, 30, "#cfc8ba"); rect(31, 25, 5, 4, "#3d2352");
      px(33 + (Math.floor(T * 2) % 2 ? 0 : 0), 26 + (Math.floor(T * 2) % 2), "#f9c56b"); // la campana se mueve
      rect(29, 21, 9, 1, "#b5532e"); rect(31, 18, 5, 3, "#f4f1ea"); rect(33, 14, 1, 4, "#3d2352");
      rect(0, 83, GW, 7, "#c99a4a");
      for (let i = 0; i < 6; i++) {
        const x = 4 + i * 12;
        rect(x + 2, 78, 1, 5, "#5b3a1e");
        for (let yy = -3; yy <= 3; yy++) for (let xx = -3; xx <= 3; xx++) if (xx * xx + yy * yy <= 10) px(x + 2 + xx, 75 + yy, "#2f6b2a");
        px(x + 1, 74, "#f39c12"); px(x + 2, 77, "#f39c12");
        // la naranja de la derecha de cada árbol se cae en su momento y bota
        const tc = 2.5 + i * 1.1, u = T - tc;
        let oy = 76;
        if (u > 0) { const g = 30; const tt = u; const d = 0.5 * g * tt * tt; oy = Math.min(82, 76 + d); if (oy >= 82 && u < 1.2) oy = 82 - Math.max(0, 2 - 6 * (u - Math.sqrt(12 / g)) ** 2 * 6); }
        px(x + 4, oy, "#f39c12");
      }
      document.getElementById("start").style.visibility = T > 2 && Math.floor(T * 2) % 2 === 0 ? "hidden" : "visible";
      const k = Math.floor(Math.min(13, T * 10));
      document.getElementById("tit").textContent = "PUEBLO BLANCO".slice(0, k).padEnd(13, " ");
    };
    listo();
  </script>
</body>
</html>
