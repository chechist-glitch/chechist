<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<style>
  body { background: #f7b267; }
  .t { position: absolute; left: 70px; top: 80px; font-family: "Playfair"; font-weight: 900; font-style: italic; font-size: 100px; color: #2b1a1e; line-height: .95; }
  .t small { display: block; font-family: "Space Mono"; font-style: normal; font-weight: 400; font-size: 20px; margin-top: 16px; }
</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <div class="t">El olivo<br />de mil años<small>una rama que se divide en dos, 11 veces · recursión</small></div>
  <script>
    const ctx = canvas2d();
    const r = rng(1000);
    // El olivo crece: cada tramo de rama sale cuando le llega su turno según la distancia
    // al suelo, las hojas brotan al final y el sol se va poniendo detrás.
    const tramos = [];
    const hojas = [];
    function rama(x, y, ang, largo, grosor, nivel, recorrido) {
      const segs = 4;
      let px = x, py = y, a = ang;
      for (let s = 0; s < segs; s++) {
        a += (r() - 0.5) * 0.35;
        const nx = px + Math.cos(a) * largo / segs, ny = py + Math.sin(a) * largo / segs;
        tramos.push({ x0: px, y0: py, x1: nx, y1: ny, w: grosor * (1 - s / segs * 0.3), d0: recorrido, d1: recorrido + largo / segs });
        recorrido += largo / segs;
        px = nx; py = ny;
      }
      if (nivel === 0) { hojas.push([px, py, recorrido]); return; }
      const abre = 0.35 + r() * 0.35;
      rama(px, py, a - abre, largo * (0.68 + r() * 0.15), grosor * 0.68, nivel - 1, recorrido);
      rama(px, py, a + abre * (0.8 + r() * 0.4), largo * (0.66 + r() * 0.15), grosor * 0.68, nivel - 1, recorrido);
    }
    rama(540, 1140, -Math.PI / 2 - 0.25, 185, 46, 10, 0);
    rama(540, 1140, -Math.PI / 2 + 0.3, 170, 40, 10, 0);
    const motas = [];
    for (const [x, y, d] of hojas) for (let k = 0; k < 5; k++) motas.push({ c: r() < 0.5 ? "rgba(43,26,30,.85)" : "rgba(70,50,40,.7)", x: x + (r() - 0.5) * 26, y: y + (r() - 0.5) * 26, a: r() * Math.PI, d });
    const dmax = Math.max(...tramos.map((q) => q.d1));
    const cl = (u) => Math.min(1, Math.max(0, u));
    window.pintar = (t) => {
      const cielo = ctx.createLinearGradient(0, 0, 0, H);
      cielo.addColorStop(0, "#f79d65"); cielo.addColorStop(0.55, "#f4845f"); cielo.addColorStop(0.75, "#f25c54"); cielo.addColorStop(1, "#6d2e46");
      ctx.fillStyle = cielo; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "rgba(255, 230, 170, .9)";
      ctx.beginPath(); ctx.arc(760, 700 + t * 14, 150, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#8c3b4a";
      ctx.beginPath(); ctx.moveTo(0, 1020);
      for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 1000 + Math.sin(x * 0.006) * 40 + Math.sin(x * 0.017) * 14);
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
      ctx.fillStyle = "#2b1a1e";
      ctx.fillRect(0, 1120, W, H);
      const frente = dmax * cl((t - 0.3) / 6.5) ** 0.8;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#2b1a1e";
      for (const q of tramos) {
        if (q.d0 >= frente) continue;
        const u = Math.min(1, (frente - q.d0) / (q.d1 - q.d0));
        ctx.lineWidth = q.w * (0.4 + 0.6 * cl((frente - q.d0) / 120));
        ctx.beginPath(); ctx.moveTo(q.x0, q.y0); ctx.lineTo(q.x0 + (q.x1 - q.x0) * u, q.y0 + (q.y1 - q.y0) * u); ctx.stroke();
      }
      for (const m of motas) {
        const k = cl((frente - m.d) / 60);
        if (k <= 0) continue;
        const viento = Math.sin(t * 1.6 + m.x * 0.01) * 0.25;
        ctx.fillStyle = m.c;
        ctx.beginPath(); ctx.ellipse(m.x, m.y, 9 * k, 3 * k, m.a + viento, 0, Math.PI * 2); ctx.fill();
      }
    };
    listo();
  </script>
</body>
</html>
