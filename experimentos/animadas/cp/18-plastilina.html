<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<script src="../../imagenes/assets/gl.js"></script>
<script src="../comun/trazar-video.js"></script>
<style>body { background: #8fd0e8; }</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <script>
    // Diorama de plastilina: formas blandas unidas con "smooth min", abolladuras y huellas,
    // luz de ventana grande con sombras suaves y desenfoque de lente
    // En el vídeo se ve cómo se calcula la imagen: de ruido a limpia, muestra a muestra.
    trazarVideo({
      escala: .67,
      muestras: 48,
      tono: true,
      expo: 0.95,
      vineta: 0.25,
      grano: 0.02,
      frag: `
      float h31(vec3 p) { p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
      float vn3(vec3 p) { vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
        return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
                   mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z); }
      float smin(float a, float b, float k) { float h = clamp(.5 + .5 * (b - a) / k, 0., 1.); return mix(b, a, h) - k * h * (1. - h); }
      float cap(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.); return length(pa - ba * h) - r; }
      float elip(vec3 p, vec3 r) { float k0 = length(p / r), k1 = length(p / (r * r)); return k0 * (k0 - 1.) / k1; }
      float cono(vec3 p, float h, float r1, float r2) {
        vec2 q = vec2(length(p.xz), p.y);
        vec2 k1 = vec2(r2, h), k2 = vec2(r2 - r1, 2. * h);
        vec2 ca = vec2(q.x - min(q.x, (q.y < 0.) ? r1 : r2), abs(q.y) - h);
        vec2 cb = q - k1 + k2 * clamp(dot(k1 - q, k2) / dot(k2, k2), 0., 1.);
        float s = (cb.x < 0. && ca.y < 0.) ? -1. : 1.;
        return s * sqrt(min(dot(ca, ca), dot(cb, cb)));
      }

      // Materiales: 1 fondo, 2 maceta, 3 tierra, 4 cactus, 5 flor, 6 centro, 7 mariquita, 8 negro, 9 nube
      vec2 escena(vec3 p) {
        float fondo = smin(p.y, p.z + 3., 1.8);
        vec2 m = vec2(fondo, 1.);
        // maceta
        vec3 q = p - vec3(0., .6, 0.);
        float maceta = cono(q, .6, .72, .95);
        maceta = smin(maceta, length(vec2(length(q.xz) - .98, q.y - .62)) - .14, .08);
        if (maceta < m.x) m = vec2(maceta, 2.);
        float tierra = max(length(q.xz) - .86, abs(q.y - .62) - .03);
        if (tierra < m.x) m = vec2(tierra, 3.);
        // cactus con costillas
        float ang = atan(p.z, p.x);
        float cost = .035 * cos(ang * 9.);
        float cac = cap(p, vec3(0., 1., 0.), vec3(0., 2.55, 0.), .44) - cost;
        cac = smin(cac, cap(p, vec3(.3, 1.65, 0.), vec3(.82, 1.8, .05), .2) - cost * .6, .12);
        cac = smin(cac, cap(p, vec3(.82, 1.8, .05), vec3(.86, 2.3, .05), .19) - cost * .6, .1);
        cac = smin(cac, cap(p, vec3(-.3, 1.9, 0.), vec3(-.74, 2., -.05), .18) - cost * .6, .12);
        cac = smin(cac, cap(p, vec3(-.74, 2., -.05), vec3(-.76, 2.32, -.05), .17) - cost * .6, .1);
        if (cac < m.x) m = vec2(cac, 4.);
        // flor
        vec3 f = p - vec3(0., 3.02, 0.);
        float flor = 1e9;
        for (int i = 0; i < 6; i++) {
          float a = float(i) * 1.0472;
          vec3 fp = f - vec3(cos(a) * .2, 0., sin(a) * .2);
          fp.xz = mat2(cos(a), sin(a), -sin(a), cos(a)) * fp.xz;
          flor = smin(flor, elip(fp, vec3(.2, .06, .1)), .03);
        }
        if (flor < m.x) m = vec2(flor, 5.);
        float centro = length(f - vec3(0., .05, 0.)) - .09;
        if (centro < m.x) m = vec2(centro, 6.);
        // mariquita
        vec3 b = p - vec3(1.75, .0, 1.1);
        float cuerpo = max(elip(b, vec3(.32, .26, .38)), -b.y);
        if (cuerpo < m.x) m = vec2(cuerpo, 7.);
        float cabeza = length(b - vec3(0., .08, .36)) - .14;
        if (cabeza < m.x) m = vec2(cabeza, 8.);
        // nube colgando
        vec3 c = p - vec3(-1.9, 3.3, -1.6);
        float nube = smin(smin(length(c) - .45, length(c - vec3(.5, -.1, 0.)) - .35, .2), length(c + vec3(.5, .12, 0.)) - .32, .2);
        nube = smin(nube, elip(c + vec3(0., .25, 0.), vec3(.95, .2, .35)), .15);
        if (nube < m.x) m = vec2(nube, 9.);
        float hilo = length(c.xz) - .008;
        hilo = max(hilo, -c.y);
        if (hilo < m.x) m = vec2(hilo, 8.);
        // abolladuras y huellas: solo cerca de la superficie para no gastar
        if (m.y > 1.5 && m.x < .08) {
          m.x += (vn3(p * 9.) - .5) * .018 + (vn3(p * 31.) - .5) * .004;
          vec3 dedo = p * 3.1;
          m.x += .0012 * sin(length(fract(dedo.xy) - .5) * 90.) * step(.82, vn3(floor(dedo) * 1.7 + 3.));
        }
        return m;
      }
      vec3 normal(vec3 p) {
        vec2 e = vec2(.0015, 0.);
        return normalize(vec3(escena(p + e.xyy).x - escena(p - e.xyy).x, escena(p + e.yxy).x - escena(p - e.yxy).x, escena(p + e.yyx).x - escena(p - e.yyx).x));
      }
      vec2 marcha(vec3 ro, vec3 rd) {
        float t = .02;
        for (int i = 0; i < 160; i++) {
          vec2 h = escena(ro + rd * t);
          if (h.x < .0008 * t) return vec2(t, h.y);
          t += h.x * .85;
          if (t > 30.) break;
        }
        return vec2(-1.);
      }
      float sombra(vec3 ro, vec3 rd, float maxt) {
        float t = .02;
        for (int i = 0; i < 70; i++) {
          float h = escena(ro + rd * t).x;
          if (h < .0005) return 0.;
          t += h;
          if (t > maxt) break;
        }
        return 1.;
      }
      float oclusion(vec3 p, vec3 n) {
        float o = 0., s = 1.;
        for (int i = 1; i <= 5; i++) { float d = .06 * float(i); o += (d - escena(p + n * d).x) * s; s *= .7; }
        return clamp(1. - 2.2 * o, 0., 1.);
      }
      vec3 albedo(float id, vec3 p, vec3 n) {
        if (id < 1.5) return vec3(.36, .66, .86);
        if (id < 2.5) return vec3(.78, .3, .14);
        if (id < 3.5) return vec3(.22, .14, .1);
        if (id < 4.5) {
          // pinchos: puntitos claros en las costillas
          float a = atan(p.z, p.x) * 9. / 6.2832;
          float pincho = step(.93, fract(a + .5)) * step(.7, fract(p.y * 7.));
          return mix(vec3(.12, .5, .22), vec3(.95, .95, .8), pincho);
        }
        if (id < 5.5) return vec3(1., .42, .62);
        if (id < 6.5) return vec3(1., .82, .2);
        if (id < 7.5) {
          vec3 b = p - vec3(1.75, 0., 1.1);
          float punto = 0.;
          for (int i = 0; i < 6; i++) {
            vec3 c = vec3((i % 2 == 0 ? -.13 : .13), .2, -.2 + float(i / 2) * .17);
            punto = max(punto, 1. - smoothstep(.055, .065, length(b - c)));
          }
          float raya = 1. - smoothstep(.01, .02, abs(b.x));
          return mix(vec3(.85, .1, .08), vec3(.03), max(punto, raya));
        }
        if (id < 8.5) return vec3(.04);
        return vec3(.97);
      }

      vec3 muestra(vec2 px) {
        vec2 uv = (px - uRes * .5) / uRes.y;
        vec3 ro = vec3(3.9, 3.1, 8.0);
        vec3 obj = vec3(.2, 1.55, 0.);
        vec3 w = normalize(obj - ro), u = normalize(cross(w, vec3(0, 1, 0))), v = cross(u, w);
        vec3 rd = normalize(uv.x * u + uv.y * v + 1.55 * w);
        // desenfoque de lente
        float foco = length(obj - ro) - .2;
        vec2 ap = rnd2();
        float ra = sqrt(ap.x) * .06, th = ap.y * 6.2832;
        vec3 lente = (u * cos(th) + v * sin(th)) * ra;
        vec3 pf = ro + rd * foco;
        ro += lente;
        rd = normalize(pf - ro);

        vec2 h = marcha(ro, rd);
        if (h.x < 0.) return vec3(.6, .8, .95);
        vec3 p = ro + rd * h.x;
        vec3 n = normal(p);
        vec3 alb = albedo(h.y, p, n);
        // luz de ventana: esfera grande (sombras suaves muestreando un punto al azar)
        vec3 lc = vec3(-4., 6.5, 5.);
        vec2 z = rnd2();
        float cz = 1. - 2. * z.x, sz = sqrt(1. - cz * cz);
        vec3 lp = lc + 1.4 * vec3(sz * cos(z.y * 6.2832), cz, sz * sin(z.y * 6.2832));
        vec3 L = normalize(lp - p);
        float dif = clamp((dot(n, L) + .25) / 1.25, 0., 1.);
        float som = dif > 0. ? sombra(p + n * .003, L, length(lp - p)) : 0.;
        float ao = oclusion(p, n);
        vec3 H = normalize(L - rd);
        float spec = pow(max(dot(n, H), 0.), 24.) * .12;
        vec3 col = alb * dif * som * vec3(1.35, 1.22, 1.05) * 1.7;
        col += spec * som;
        // relleno del cielo y rebote cálido del suelo
        col += alb * ao * (vec3(.3, .38, .5) * (.6 + .4 * n.y) + vec3(.16, .12, .08) * clamp(-n.y + .3, 0., 1.));
        // borde translúcido de la plastilina
        col += alb * pow(1. - max(dot(n, -rd), 0.), 3.) * .18 * ao;
        return col;
      }`,
    });
    listo();
  </script>
</body>
</html>
