<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<script src="../../imagenes/assets/gl.js"></script>
<script src="../comun/trazar-video.js"></script>
<style>body { background: #000; }
  .p { position: absolute; left: 50px; bottom: 44px; font: 16px "Plex Mono"; color: rgba(255,225,190,.75); line-height: 1.6; }</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <div class="p">métrica de Schwarzschild · cada rayo se integra paso a paso, curvado por la gravedad<br />disco de acreción con desplazamiento Doppler relativista y anillo de fotones</div>
  <script>
    // Agujero negro: los rayos de luz se curvan con la aceleración efectiva de la relatividad
    // general (−3/2·h²·r/|r|⁵) y se colorea el disco según temperatura y efecto Doppler.
    // En el vídeo se ve cómo se calcula la imagen: de ruido a limpia, muestra a muestra.
    trazarVideo({
      escala: .67,
      muestras: 48,
      tono: true,
      expo: 1.1,
      vineta: 0.3,
      grano: 0.015,
      frag: `
      float h31(vec3 p) { p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
      float vn3(vec3 p) { vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
        return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
                   mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z); }
      float fbm(vec3 p) { float s = 0., a = .5; for (int i = 0; i < 5; i++) { s += a * vn3(p); p *= 2.03; a *= .5; } return s; }
      vec3 cuerpoNegro(float T) {
        // aproximación del color de un cuerpo negro (T en miles de K)
        T = clamp(T, 1., 40.);
        vec3 c = vec3(1., clamp(.39 * log(T) - .0, 0., 1.), clamp(.54 * log(T - .9) - .3, 0., 1.));
        if (T > 6.6) c = vec3(clamp(1.29 * pow(T - 6., -.13), 0., 1.), clamp(1.13 * pow(T - 6., -.075), 0., 1.), 1.);
        return c;
      }
      vec3 fondo(vec3 d) {
        vec3 c = vec3(0.);
        // estrellas en varias capas
        for (int k = 0; k < 3; k++) {
          vec3 q = d * (180. + float(k) * 140.);
          vec3 id = floor(q);
          float h = h31(id + float(k) * 13.);
          if (h > .985) {
            vec3 cen = id + .5 + (vec3(h31(id + 1.), h31(id + 2.), h31(id + 3.)) - .5) * .6;
            float b = exp(-dot(q - cen, q - cen) * 9.) * (h - .985) * 120.;
            c += b * mix(vec3(1., .8, .6), vec3(.6, .75, 1.), h31(id + 5.));
          }
        }
        // nebulosa tenue
        float n = fbm(d * 3. + 2.);
        c += vec3(.25, .1, .3) * pow(n, 3.) * .5 + vec3(.05, .1, .2) * pow(fbm(d * 6.), 4.) * .6;
        return c;
      }
      vec3 muestra(vec2 px) {
        vec2 uv = (px - uRes * .5) / uRes.y;
        vec3 ro = vec3(0., 2.2, -26.);
        vec3 ta = vec3(0., 0., 0.);
        vec3 w = normalize(ta - ro), u = normalize(cross(w, vec3(.18, 1, 0))), v = cross(u, w);
        vec3 rd = normalize(uv.x * u + uv.y * v + 1.6 * w);
        vec3 p = ro, vel = rd;
        vec3 h = cross(p, vel);
        float h2 = dot(h, h);
        vec3 col = vec3(0.);
        float trans = 1.;
        for (int i = 0; i < 420; i++) {
          float r2 = dot(p, p);
          float r = sqrt(r2);
          if (r < 1.0) { trans = 0.; break; }
          float dt = clamp(.06 * r, .02, .6);
          vec3 acc = -1.5 * h2 * p / (r2 * r2 * r);
          vec3 pn = p + vel * dt;
          vel += acc * dt;
          // ¿cruza el plano del disco?
          if (p.y * pn.y < 0.) {
            vec3 c = mix(p, pn, p.y / (p.y - pn.y));
            float rc = length(c.xz);
            if (rc > 2.6 && rc < 14.) {
              float ang = atan(c.z, c.x);
              // turbulencia arrastrada por la rotación (más rápida dentro)
              float rot = ang + 6. / pow(rc, 1.5);
              float den = smoothstep(2.6, 3.4, rc) * smoothstep(14., 8., rc);
              den *= .45 + .9 * fbm(vec3(cos(rot) * rc, sin(rot) * rc, rc * .6) * .55);
              // Doppler: el lado que viene hacia nosotros se ve más azul y brillante
              vec3 vdisco = normalize(vec3(-c.z, 0., c.x)) * sqrt(.5 / rc);
              float dop = 1. / (1. - dot(vdisco, normalize(-vel)) * 1.6);
              float T = 9. * pow(rc / 2.6, -.75) * dop;
              vec3 e = cuerpoNegro(T) * den * pow(dop, 3.) * 1.6 * pow(2.6 / rc, 1.6);
              col += trans * e;
              trans *= 1. - den * .85;
              if (trans < .02) break;
            }
          }
          p = pn;
          if (r > 60.) break;
        }
        col += trans * fondo(normalize(vel));
        return col;
      }`,
    });
    listo();
  </script>
</body>
</html>
