<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../imagenes/assets/base.css" />
<script src="../../imagenes/assets/lib.js"></script>
<script src="../comun/fases.js"></script>
<script src="../../imagenes/assets/mas.js"></script>
<style>body { background: #120a2a; }</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <script>
    const fases = crearFases({});
    // La gran ola de Hokusai en una Cádiz ciberpunk: tintas planas de xilografía + neón
    (async () => {
      await M.fuentes('40px "DM Serif"', '18px "Plex Mono"');
      const ctx = canvas2d();
      const r = rng(1831);
      const HOR = 800;

      // Cielo nocturno
      const cielo = ctx.createLinearGradient(0, 0, 0, HOR);
      cielo.addColorStop(0, "#0b0620");
      cielo.addColorStop(0.45, "#2a0c46");
      cielo.addColorStop(0.8, "#7a1a63");
      cielo.addColorStop(1, "#ff4f8b");
      ctx.fillStyle = cielo;
      ctx.fillRect(0, 0, W, HOR);
      for (let i = 0; i < 380; i++) {
        ctx.fillStyle = `rgba(255,235,255,${r() * 0.7})`;
        ctx.fillRect(r() * W, r() * 560, 1.6, 1.6);
      }

      // Sol a franjas (se pinta aparte para poder vaciar las franjas)
      const sol = M.lienzo();
      const sx = 780, sy = 470, sr = 190;
      const gs = sol.x.createLinearGradient(0, sy - sr, 0, sy + sr);
      gs.addColorStop(0, "#ffe27a");
      gs.addColorStop(0.55, "#ff7a59");
      gs.addColorStop(1, "#ff2e88");
      sol.x.fillStyle = gs;
      sol.x.beginPath();
      sol.x.arc(sx, sy, sr, 0, Math.PI * 2);
      sol.x.fill();
      sol.x.globalCompositeOperation = "destination-out";
      for (let k = 0; k < 9; k++) sol.x.fillRect(0, sy + 10 + k * 21, W, 2 + k * 1.5);
      ctx.save();
      ctx.shadowColor = "#ff3d8f";
      ctx.shadowBlur = 90;
      ctx.drawImage(sol.c, 0, 0);
      ctx.restore();

      // Ciudad al fondo
      let x = -10;
      const neones = [];
      while (x < W) {
        const w = 34 + r() * 70;
        const h = 60 + r() * r() * 330;
        const g = ctx.createLinearGradient(0, HOR - h, 0, HOR);
        g.addColorStop(0, "#241043");
        g.addColorStop(1, "#12071f");
        ctx.fillStyle = g;
        ctx.fillRect(x, HOR - h, w, h);
        if (h > 250) {
          ctx.fillRect(x + w / 2 - 1.5, HOR - h - 40, 3, 40);
          ctx.fillStyle = "#ff3355";
          ctx.fillRect(x + w / 2 - 3, HOR - h - 44, 6, 6);
        }
        for (let wy = HOR - h + 10; wy < HOR - 8; wy += 11)
          for (let wx = x + 5; wx < x + w - 7; wx += 8)
            if (r() < 0.32) {
              ctx.fillStyle = r() < 0.7 ? "rgba(94,242,255,.75)" : "rgba(255,207,94,.8)";
              ctx.fillRect(wx, wy, 4, 5);
            }
        if (r() < 0.35 && h > 140) neones.push([x + w * 0.5, HOR - h + 30, r() < 0.5 ? "#37f5ff" : "#ff4fd8"]);
        x += w + 2;
      }
      // Rótulos verticales de neón
      const palabras = ["BAR", "TAPAS", "24H", "OLÉ", "HOTEL", "RAMEN"];
      ctx.font = '22px "Plex Mono"';
      ctx.textAlign = "center";
      neones.forEach(([nx, ny, col], i) => {
        const pal = palabras[i % palabras.length];
        const alto = pal.length * 24 + 14;
        ctx.save();
        ctx.shadowColor = col;
        ctx.shadowBlur = 18;
        ctx.strokeStyle = col;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(nx - 17, ny, 34, alto);
        ctx.fillStyle = "#fff";
        for (let k = 0; k < pal.length; k++) ctx.fillText(pal[k], nx, ny + 28 + k * 24);
        ctx.restore();
      });

      // Mar del fondo con reflejos
      const mar = ctx.createLinearGradient(0, HOR, 0, H);
      mar.addColorStop(0, "#1d0f45");
      mar.addColorStop(1, "#050a24");
      ctx.fillStyle = mar;
      ctx.fillRect(0, HOR, W, H - HOR);
      for (let y = HOR + 4; y < H; y += 6) {
        const a = 1 - (y - HOR) / 420;
        if (a <= 0) break;
        const ancho = (70 + r() * 90) * (1 + (y - HOR) / 300);
        ctx.fillStyle = `rgba(255,120,170,${a * 0.55})`;
        ctx.fillRect(sx - ancho / 2 + (r() - 0.5) * 40, y, ancho, 2);
      }
      // Monte Fuji de holograma en el horizonte
      ctx.save();
      ctx.shadowColor = "#37f5ff";
      ctx.shadowBlur = 14;
      ctx.strokeStyle = "#8ffcff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(870, HOR + 2);
      ctx.quadraticCurveTo(935, HOR - 30, 968, HOR - 88);
      ctx.lineTo(990, HOR - 88);
      ctx.quadraticCurveTo(1020, HOR - 30, 1080, HOR + 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(955, HOR - 64);
      ctx.lineTo(966, HOR - 56);
      ctx.lineTo(976, HOR - 66);
      ctx.lineTo(988, HOR - 55);
      ctx.lineTo(1003, HOR - 64);
      ctx.stroke();
      ctx.restore();

      // Olas pequeñas del mar (escamas de xilografía)
      ctx.strokeStyle = "rgba(55,245,255,.35)";
      ctx.lineWidth = 1.6;
      for (let y = HOR + 30; y < H; y += 26) {
        const off = (y / 26) % 2 ? 0 : 22;
        for (let xx = -44 + off; xx < W + 44; xx += 44) {
          ctx.beginPath();
          ctx.arc(xx, y, 20, Math.PI * 1.05, Math.PI * 1.95);
          ctx.stroke();
        }
      }

      // --- La gran ola: banda en espiral con grosor que se afina hacia la punta ---
      function ola(cx, cy, esc, fin) {
        const ext = [], int = [];
        const N = 260;
        for (let i = 0; i <= N; i++) {
          const s = i / N;
          const t = s * fin;
          const dec = Math.exp(-0.2 * t);
          const rx = 420 * esc * dec, ry = 330 * esc * dec;
          const grosor = esc * (10 + 150 * Math.pow(1 - s, 1.3));
          const a = Math.PI + t;
          ext.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a), s, a]);
          int.push([cx + (rx - grosor) * Math.cos(a), cy + (ry - grosor * 0.8) * Math.sin(a)]);
        }
        return { ext, int };
      }
      function cuerpo(o, cx, cy, esc) {
        const p = new Path2D();
        p.moveTo(o.ext[0][0] - 140 * esc, H);
        p.lineTo(o.ext[0][0] - 50 * esc, cy + 330 * esc);
        o.ext.forEach(([x, y]) => p.lineTo(x, y));
        for (let i = o.int.length - 1; i >= 0; i--) p.lineTo(o.int[i][0], o.int[i][1]);
        p.bezierCurveTo(cx - 230 * esc, cy + 220 * esc, cx - 60 * esc, cy + 420 * esc, cx + 260 * esc, cy + 470 * esc);
        p.lineTo(cx + 330 * esc, H);
        p.closePath();
        return p;
      }

      function garra(g, x, y, ang, largo, ancho, prof) {
        // Dedo de espuma que se enrosca, con garras más pequeñas en la punta
        const pts = [];
        let a = ang, px = x, py = y;
        const pasos = 10;
        const giro = (r() < 0.5 ? -1 : 1) * (0.08 + r() * 0.1);
        for (let i = 0; i <= pasos; i++) {
          pts.push([px, py, ancho * (1 - i / pasos * 0.85)]);
          px += Math.cos(a) * largo / pasos;
          py += Math.sin(a) * largo / pasos;
          a += giro;
        }
        const izq = pts.map(([px, py, w], i) => {
          const b = i < pts.length - 1 ? Math.atan2(pts[i + 1][1] - py, pts[i + 1][0] - px) : a;
          return [px + Math.cos(b - Math.PI / 2) * w, py + Math.sin(b - Math.PI / 2) * w, px + Math.cos(b + Math.PI / 2) * w, py + Math.sin(b + Math.PI / 2) * w];
        });
        g.beginPath();
        izq.forEach(([lx, ly], i) => (i ? g.lineTo(lx, ly) : g.moveTo(lx, ly)));
        g.arc(px, py, ancho * 0.18, a - Math.PI / 2, a + Math.PI / 2);
        for (let i = izq.length - 1; i >= 0; i--) g.lineTo(izq[i][2], izq[i][3]);
        g.closePath();
        g.fill();
        g.stroke();
        if (prof > 0) {
          const hijos = 2 + Math.floor(r() * 2);
          for (let k = 0; k < hijos; k++) garra(g, px, py, a + (k - (hijos - 1) / 2) * 0.7 + (r() - 0.5) * 0.3, largo * 0.45, ancho * 0.45, prof - 1);
        }
      }

      function pintaOla(cx, cy, esc, fin) {
        const o = ola(cx, cy, esc, fin);
        const forma = cuerpo(o, cx, cy, esc);
        ctx.save();
        const g = ctx.createLinearGradient(0, cy - 300 * esc, 0, H);
        g.addColorStop(0, "#1b5fd0");
        g.addColorStop(0.35, "#0e2f86");
        g.addColorStop(1, "#050d33");
        ctx.fillStyle = g;
        ctx.fill(forma);
        ctx.clip(forma);
        // Vetas paralelas dentro de la ola
        for (let u = 0.12; u < 1.3; u += 0.11) {
          ctx.beginPath();
          o.ext.forEach(([x, y, s], i) => {
            const [ix, iy] = o.int[i];
            const k = Math.min(1, u);
            const px = x + (ix - x) * k, py = y + (iy - y) * k + Math.max(0, u - 1) * 300;
            i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
          });
          ctx.strokeStyle = u < 0.5 ? "rgba(120,220,255,.55)" : "rgba(55,160,255,.35)";
          ctx.lineWidth = 3 * esc + 1;
          ctx.stroke();
        }
        // Vetas verticales de la pared de la ola
        for (let i = 0; i < 26; i++) {
          const x0 = cx - 380 * esc + i * 22 * esc;
          ctx.beginPath();
          ctx.moveTo(x0, cy - 40 * esc);
          ctx.bezierCurveTo(x0 + 20 * esc, cy + 150 * esc, x0 - 40 * esc, cy + 300 * esc, x0 + 30 * esc, H);
          ctx.strokeStyle = "rgba(10,20,70,.5)";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        // Red de espuma blanca, como en el grabado
        for (let i = 0; i < 40 * esc; i++) {
          const x0 = cx - 420 * esc + r() * 700 * esc, y0 = cy + r() * 500 * esc;
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.bezierCurveTo(x0 + 30, y0 + 20, x0 + 60, y0 - 10, x0 + 90 + r() * 60, y0 + 15);
          ctx.strokeStyle = "rgba(230,240,255,.45)";
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        ctx.restore();
        ctx.strokeStyle = "#050b2a";
        ctx.lineWidth = 3;
        ctx.stroke(forma);

        // Espuma en capa aparte para darle brillo de neón
        const esp = M.lienzo();
        const e = esp.x;
        e.fillStyle = "#f6f2ff";
        e.strokeStyle = "#081a55";
        e.lineWidth = 2;
        e.lineJoin = "round";
        // Ribete blanco festoneado por dentro del borde
        o.ext.forEach(([x, y, s], i) => {
          if (s < 0.28 || i % 3) return;
          const [ix, iy] = o.int[i];
          const rad = (6 + 10 * s) * esc;
          const k = 0.18;
          e.beginPath();
          e.arc(x + (ix - x) * k, y + (iy - y) * k, rad, 0, Math.PI * 2);
          e.fill();
          e.stroke();
        });
        // Garras a lo largo del labio
        for (let i = Math.floor(o.ext.length * 0.4); i < o.ext.length - 2; i += 5) {
          const [x, y, s, a] = o.ext[i];
          const normal = a; // hacia fuera de la espiral
          const ang = normal * 0.55 + Math.PI / 2 * 0.45 + (r() - 0.5) * 0.5;
          garra(e, x, y, ang, (26 + r() * 30) * esc * (0.7 + s), (11 + r() * 6) * esc, 1);
        }
        // Salpicaduras como copos
        for (let i = 0; i < 180 * esc; i++) {
          const k = Math.floor(o.ext.length * (0.45 + r() * 0.55));
          const [x, y] = o.ext[Math.min(k, o.ext.length - 1)];
          const d = 20 + r() * 110 * esc;
          const a = -Math.PI / 2 + (r() - 0.3) * 2.2;
          e.beginPath();
          e.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, 1.5 + r() * 3.5 * esc, 0, Math.PI * 2);
          e.fill();
        }
        ctx.save();
        ctx.shadowColor = "#ff4fd8";
        ctx.shadowBlur = 26;
        ctx.drawImage(esp.c, 0, 0);
        ctx.restore();
        ctx.drawImage(esp.c, 0, 0);
      }

      // Barca con luces entre las olas
      function barca(bx, by, ang, largo) {
        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(ang);
        ctx.fillStyle = "#0d0822";
        ctx.beginPath();
        ctx.moveTo(-largo / 2, 0);
        ctx.quadraticCurveTo(0, 26, largo / 2, -6);
        ctx.lineTo(largo / 2 - 8, -12);
        ctx.quadraticCurveTo(0, 8, -largo / 2 + 6, -8);
        ctx.closePath();
        ctx.fill();
        ctx.shadowColor = "#37f5ff";
        ctx.shadowBlur = 12;
        ctx.fillStyle = "#9ffcff";
        for (let k = 0; k < 9; k++) {
          const t = -0.4 + k * 0.1;
          ctx.fillRect(t * largo - 3, -12 + Math.abs(t) * 6, 6, 3);
        }
        ctx.restore();
      }

      barca(820, 960, -0.12, 200);
      pintaOla(480, 660, 1, 4.1);
      barca(560, 1150, 0.2, 260);
      pintaOla(880, 1120, 0.5, 3.9);

      // Cartela vertical y sello
      ctx.fillStyle = "#f2e6c9";
      ctx.fillRect(60, 60, 84, 360);
      ctx.strokeStyle = "#3b1f2b";
      ctx.lineWidth = 3;
      ctx.strokeRect(66, 66, 72, 348);
      ctx.fillStyle = "#2b1830";
      ctx.font = '36px "DM Serif"';
      ctx.textAlign = "center";
      "OLA·NEÓN".split("").forEach((l, i) => ctx.fillText(l, 102, 112 + i * 40));
      ctx.fillStyle = "#f2e6c9";
      ctx.fillRect(156, 60, 44, 220);
      ctx.fillStyle = "#2b1830";
      ctx.font = '16px "Plex Mono"';
      "CÁDIZ2077".split("").forEach((l, i) => ctx.fillText(l, 178, 88 + i * 21));
      ctx.fillStyle = "#d2233f";
      ctx.fillRect(952, 1222, 72, 72);
      ctx.fillStyle = "#f6e7d2";
      ctx.font = '44px "DM Serif"';
      ctx.fillText("Q", 988, 1274);

      M.papel(ctx, 1.4, 1831);
      M.grano(ctx, 14, 18);
      fases.marca(); fases.preparar(); listo();
    })();
  </script>
</body>
</html>
