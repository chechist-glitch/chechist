<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/base.css" />
<script src="../assets/lib.js"></script>
<style>body { background: #f6d7b0; }</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <script>
    const ctx = canvas2d();
    const r = rng(33);
    const n = makeNoise(33);

    // Textura de fibra de papel, reutilizada en cada capa
    const fibra = document.createElement("canvas"); fibra.width = W; fibra.height = H;
    const fc = fibra.getContext("2d");
    const fi = fc.createImageData(W, H);
    for (let i = 0; i < W * H; i++) {
      const x = i % W, y = (i / W) | 0;
      const v = 128 + (n(x * 0.9, y * 0.9, 2) - 0.5) * 40 + (r() - 0.5) * 18;
      fi.data[i * 4] = fi.data[i * 4 + 1] = fi.data[i * 4 + 2] = v; fi.data[i * 4 + 3] = 255;
    }
    fc.putImageData(fi, 0, 0);
    for (let k = 0; k < 900; k++) {
      fc.strokeStyle = `rgba(${r() < .5 ? 255 : 0},${r() < .5 ? 255 : 0},${r() < .5 ? 255 : 0},0.05)`;
      fc.lineWidth = 0.6;
      const x = r() * W, y = r() * H, a = r() * Math.PI;
      fc.beginPath(); fc.moveTo(x, y); fc.quadraticCurveTo(x + Math.cos(a) * 10 + 5, y + Math.sin(a) * 10, x + Math.cos(a) * 22, y + Math.sin(a) * 22); fc.stroke();
    }

    function hoja(camino, color, sombra = 26) {
      // Canto de la cartulina: un filo claro que asoma solo por arriba
      ctx.save(); ctx.translate(0, -2.2); ctx.fillStyle = "rgba(255, 244, 228, 0.75)"; camino(); ctx.fill(); ctx.restore();
      // Sombra que la hoja proyecta sobre la de detrás
      ctx.save();
      ctx.shadowColor = "rgba(60, 20, 30, 0.45)";
      ctx.shadowBlur = sombra; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = sombra * 0.35;
      ctx.fillStyle = color; camino(); ctx.fill();
      ctx.restore();
      // Fibra del papel, solo dentro de la hoja
      ctx.save(); camino(); ctx.clip();
      ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = 0.35; ctx.drawImage(fibra, 0, 0);
      ctx.restore();
    }
    const cresta = (base, amp, frec, fase, rug) => (x) => base + Math.sin(x * frec + fase) * amp + (n(x * rug, fase, 3) - 0.5) * amp * 1.4;
    const monte = (f) => () => { ctx.beginPath(); ctx.moveTo(-20, H + 20); for (let x = -20; x <= W + 20; x += 6) ctx.lineTo(x, f(x)); ctx.lineTo(W + 20, H + 20); ctx.closePath(); };

    // Fondo: cielo en degradado de cartulina
    const cielo = ctx.createLinearGradient(0, 0, 0, H * 0.7);
    cielo.addColorStop(0, "#f7c59f"); cielo.addColorStop(0.55, "#f4a582"); cielo.addColorStop(1, "#ee8a74");
    ctx.fillStyle = cielo; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = 0.3; ctx.drawImage(fibra, 0, 0); ctx.restore();
    // Sol recortado, con aro
    hoja(() => { ctx.beginPath(); ctx.arc(700, 470, 150, 0, Math.PI * 2); }, "#fde2a7", 18);
    hoja(() => { ctx.beginPath(); ctx.arc(700, 470, 150, 0, Math.PI * 2); ctx.arc(700, 470, 120, 0, Math.PI * 2, true); }, "#fbc975", 10);
    // Nubes de papel
    const nube = (cx, cy, s) => () => { ctx.beginPath(); ctx.ellipse(cx, cy, 90 * s, 26 * s, 0, 0, Math.PI * 2); ctx.ellipse(cx - 40 * s, cy - 12 * s, 46 * s, 34 * s, 0, 0, Math.PI * 2); ctx.ellipse(cx + 30 * s, cy - 20 * s, 54 * s, 42 * s, 0, 0, Math.PI * 2); };
    hoja(nube(260, 300, 1.2), "#fbe3cf", 16);
    hoja(nube(880, 250, 0.9), "#fbe3cf", 16);
    hoja(nube(520, 640, 0.8), "#fcd9c0", 14);

    // Capas de sierra, de lejos a cerca
    const colores = ["#e9967a", "#d9776f", "#c05d6c", "#9c4a6b", "#733d66", "#4f325e", "#342a53", "#221f43", "#161836"];
    colores.forEach((col, i) => {
      const base = 640 + i * 78;
      const f = cresta(base, 40 + i * 6, 0.004 + i * 0.0007, i * 1.7, 0.006 + i * 0.001);
      hoja(monte(f), col, 22 + i * 3);
      // Olivos redondos sobre las lomas medias y cipreses junto al pueblo
      if (i === 4 || i === 5) {
        for (let k = 0; k < 7; k++) {
          const x = 60 + k * 150 + r() * 60, y = f(x) + 6, s = 0.7 + r() * 0.5 + (i - 4) * 0.3;
          hoja(() => { ctx.beginPath(); ctx.rect(x - 3 * s, y - 20 * s, 6 * s, 26 * s); ctx.ellipse(x, y - 34 * s, 26 * s, 20 * s, 0, 0, Math.PI * 2); }, colores[i + 1], 10);
        }
      }
      if (i === 3) {
        for (const x of [180, 520, 560]) {
          const y = f(x) + 10;
          hoja(() => { ctx.beginPath(); ctx.moveTo(x, y - 110); ctx.quadraticCurveTo(x + 22, y - 40, x + 12, y); ctx.lineTo(x - 12, y); ctx.quadraticCurveTo(x - 22, y - 40, x, y - 110); }, "#5b3a63", 10);
        }
      }
      // Pueblo blanco en la cuarta capa
      if (i === 3) {
        for (let k = 0; k < 9; k++) {
          const x = 220 + k * 34 + (r() - 0.5) * 10, y = f(x) + 8;
          const w = 26 + r() * 16, h = 18 + r() * 16;
          hoja(() => { ctx.beginPath(); ctx.rect(x, y - h, w, h + 20); }, "#fbf3ea", 8);
        }
        const tx = 330, ty = f(tx) - 20;
        hoja(() => { ctx.beginPath(); ctx.rect(tx, ty - 70, 24, 100); ctx.moveTo(tx - 2, ty - 70); ctx.lineTo(tx + 12, ty - 96); ctx.lineTo(tx + 26, ty - 70); }, "#fbf3ea", 8);
      }
    });
    // Pájaros
    ctx.fillStyle = "#4f325e";
    for (let k = 0; k < 7; k++) {
      const x = 420 + k * 42 + r() * 20, y = 380 + Math.sin(k) * 30 + r() * 20, s = 0.6 + r() * 0.5;
      hoja(() => { ctx.beginPath(); ctx.moveTo(x - 18 * s, y); ctx.quadraticCurveTo(x - 8 * s, y - 10 * s, x, y + 2 * s); ctx.quadraticCurveTo(x + 8 * s, y - 10 * s, x + 18 * s, y); ctx.quadraticCurveTo(x + 8 * s, y - 4 * s, x, y + 5 * s); ctx.quadraticCurveTo(x - 8 * s, y - 4 * s, x - 18 * s, y); }, "#5a3565", 5);
    }
    listo();
  </script>
</body>
</html>
