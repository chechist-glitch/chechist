<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/base.css" />
<script src="../assets/lib.js"></script>
<style>body { background: #f1e9d6; }</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <script>
    const ctx = canvas2d();
    const r = rng(1884);
    const n = makeNoise(1884);
    const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * Math.max(0, Math.min(1, t)));

    // La escena "pensada" (Caleta de Cádiz al atardecer)
    const HOR = 700;
    function escena(x, y) {
      // Faro sobre las rocas a la derecha
      if (x > 850 && x < 900 && y > 430 && y < 690 - (x - 850) * 0.1) return y < 470 ? [240, 200, 110] : ((y / 40 | 0) % 2 ? [235, 225, 210] : [190, 60, 50]);
      if (x > 780 && y > 640 && y < 760 && y > 690 - Math.sin((x - 780) * 0.02) * 40 - (x - 780) * 0.12) return mix([80, 60, 90], [120, 80, 70], (y - 640) / 120);
      // Barca de vela
      const bx = 330, by = 740;
      if (y > by - 170 && y < by - 10 && x > bx && x < bx + (y - (by - 170)) * 0.55) return [250, 240, 225];
      if (y > by - 10 && y < by + 16 && x > bx - 70 + (y - by) * 1.2 && x < bx + 130 - (y - by) * 1.2) return [120, 50, 45];
      // Sombrillas en la arena
      for (const [sx, sy, c] of [[180, 1060, [220, 60, 60]], [540, 1110, [60, 110, 200]], [860, 1050, [240, 180, 50]]]) {
        const d = Math.hypot((x - sx) / 1.6, y - sy);
        if (y < sy && d < 60) return c;
        if (Math.abs(x - sx) < 4 && y > sy && y < sy + 110) return [90, 70, 60];
      }
      const sol = Math.hypot(x - 540, y - 610);
      if (y < HOR) {
        if (sol < 70) return [255, 240, 190];
        const t = y / HOR;
        let c = mix([70, 70, 150], [210, 100, 150], t * 1.3);
        c = mix(c, [255, 160, 80], (t - 0.55) * 2.2);
        c = mix(c, [255, 210, 130], 1 - sol / 260);
        // Nubes alargadas
        const nube = n(x * 0.004, y * 0.02, 3);
        if (nube > 0.58) c = mix(c, [150, 80, 120], (nube - 0.58) * 4);
        return c;
      }
      if (y < 960) {
        // Mar con columna de reflejo del sol
        const prof = (y - HOR) / 260;
        let c = mix([230, 120, 90], [40, 70, 120], prof * 1.4);
        const refl = Math.exp(-Math.pow((x - 540) / (40 + prof * 110), 2)) * (0.6 + 0.4 * Math.sin(y * 0.6 + n(x * 0.02, y * 0.1) * 6));
        c = mix(c, [255, 220, 150], refl);
        return c;
      }
      // Arena y orilla mojada
      if (y < 990) return mix([180, 150, 150], [240, 200, 150], (y - 960) / 30);
      return mix([240, 200, 140], [210, 150, 100], (y - 990) / 360 + n(x * 0.01, y * 0.01) * 0.3);
    }
    // Complementario aproximado para los toques de contraste
    const complementario = ([a, b, c]) => [255 - a * 0.6, 255 - b * 0.6, 255 - c * 0.6];

    ctx.fillStyle = "#f1e9d6"; ctx.fillRect(0, 0, W, H);
    // Puntos en rejilla con desorden (reparto uniforme sin grumos)
    const paso = 5.2;
    const puntos = [];
    for (let y = 0; y < H; y += paso) for (let x = 0; x < W; x += paso) puntos.push([x + r() * paso, y + r() * paso]);
    for (let i = puntos.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [puntos[i], puntos[j]] = [puntos[j], puntos[i]]; }
    for (let pasada = 0; pasada < 2; pasada++) {
      for (const [x, y] of puntos) {
        let c = escena(x, y);
        const tipo = r();
        if (tipo < 0.07 && c[0] + c[1] + c[2] < 620) c = complementario(c);
        else if (tipo < 0.25) c = mix(c, [255, 255, 255], 0.25);
        const j = () => (r() - 0.5) * 50;
        ctx.fillStyle = `rgb(${c[0] + j() | 0},${c[1] + j() | 0},${c[2] + j() | 0})`;
        ctx.beginPath();
        ctx.ellipse(x + (r() - .5) * 2, y + (r() - .5) * 2, 2.9 + r() * 1.2, 2.5 + r() * 1.1, r() * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // Textura de lienzo encima
    const img = ctx.getImageData(0, 0, W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const k = (y * W + x) * 4, t = (x % 3 === 0 || y % 3 === 0) ? 0.97 : 1.01;
      img.data[k] *= t; img.data[k + 1] *= t; img.data[k + 2] *= t;
    }
    ctx.putImageData(img, 0, 0);
    listo();
  </script>
</body>
</html>
