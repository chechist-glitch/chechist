<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/base.css" />
<script src="../assets/lib.js"></script>
<script src="../assets/gl.js"></script>
<style>body { background: #000; }</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <script>
    // Trazado de rayos (path tracing): cada píxel lanza rayos que rebotan
    // por la escena; al promediar cientos de muestras sale luz realista.
    const frag = `
    float h13(vec3 p) { p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
    float vn(vec3 p) {
      vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
      return mix(mix(mix(h13(i), h13(i + vec3(1,0,0)), f.x), mix(h13(i + vec3(0,1,0)), h13(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(h13(i + vec3(0,0,1)), h13(i + vec3(1,0,1)), f.x), mix(h13(i + vec3(0,1,1)), h13(i + vec3(1,1,1)), f.x), f.y), f.z);
    }
    float fbm(vec3 p) { float s = 0., a = .5; for (int i = 0; i < 6; i++) { s += a * vn(p); p = p * 2.03 + 1.7; a *= .5; } return s; }

    const vec4 CRISTAL = vec4(-0.95, 0.75, 0.15, 0.75);
    const vec4 NARANJA = vec4(0.55, 0.62, -0.75, 0.62);
    const vec4 CROMO   = vec4(1.05, 0.34, 0.75, 0.34);
    const vec4 NARANJA2= vec4(-0.2, 0.42, -1.55, 0.42);
    const vec4 LUZ     = vec4(-4.5, 6.0, 3.0, 2.2);

    float iSph(vec3 ro, vec3 rd, vec4 s) {
      vec3 oc = ro - s.xyz; float b = dot(oc, rd); float c = dot(oc, oc) - s.w * s.w;
      float h = b * b - c; if (h < 0.) return -1.; h = sqrt(h);
      float t = -b - h; if (t < 1e-3) t = -b + h; return t < 1e-3 ? -1. : t;
    }
    // Materiales: 1 mármol, 2 cristal, 3 naranja, 4 cromo, 5 luz, 6 pared
    float traza(vec3 ro, vec3 rd, out vec3 n, out int m) {
      float t = 1e9; m = 0; float h;
      h = iSph(ro, rd, CRISTAL); if (h > 0. && h < t) { t = h; m = 2; n = (ro + rd * h - CRISTAL.xyz) / CRISTAL.w; }
      h = iSph(ro, rd, NARANJA); if (h > 0. && h < t) { t = h; m = 3; n = (ro + rd * h - NARANJA.xyz) / NARANJA.w; }
      h = iSph(ro, rd, NARANJA2); if (h > 0. && h < t) { t = h; m = 7; n = (ro + rd * h - NARANJA2.xyz) / NARANJA2.w; }
      h = iSph(ro, rd, CROMO); if (h > 0. && h < t) { t = h; m = 4; n = (ro + rd * h - CROMO.xyz) / CROMO.w; }
      h = iSph(ro, rd, LUZ); if (h > 0. && h < t) { t = h; m = 5; n = (ro + rd * h - LUZ.xyz) / LUZ.w; }
      if (rd.y < 0.) { h = -ro.y / rd.y; vec3 p = ro + rd * h; if (h > 1e-3 && h < t && abs(p.x) < 4.2 && p.z > -3.2 && p.z < 9.0) { t = h; m = 1; n = vec3(0, 1, 0); } }
      if (rd.z < 0.) { h = (-5.0 - ro.z) / rd.z; if (h > 1e-3 && h < t) { t = h; m = 6; n = vec3(0, 0, 1); } }
      return t;
    }
    vec3 base(vec3 n) {
      vec3 u = normalize(abs(n.x) > .9 ? cross(n, vec3(0,1,0)) : cross(n, vec3(1,0,0)));
      vec3 v = cross(n, u);
      vec2 r = rnd2(); float a = 2. * PI * r.x, s = sqrt(r.y);
      return normalize(u * cos(a) * s + v * sin(a) * s + n * sqrt(1. - r.y));
    }
    vec3 esfera() { vec2 r = rnd2(); float z = r.x * 2. - 1., a = r.y * 2. * PI; return vec3(sqrt(1. - z * z) * vec2(cos(a), sin(a)), z); }
    vec3 marmol(vec3 p) {
      vec3 q = p * 1.1;
      float w = fbm(q + fbm(q * 1.7) * 2.2);
      float vena = pow(1. - abs(sin((q.x * 1.3 + q.z * .7 + w * 5.) * 2.)), 18.);
      float vena2 = pow(1. - abs(sin((q.z * 2. - q.x + w * 7.) * 3.)), 30.);
      vec3 c = mix(vec3(.86, .84, .8), vec3(.94, .93, .9), fbm(p * 4.));
      c = mix(c, vec3(.35, .33, .32), vena * .75);
      c = mix(c, vec3(.55, .5, .45), vena2 * .5);
      return c;
    }
    vec3 cielo(vec3 rd) {
      // Estudio: fondo oscuro cálido y un "softbox" arriba a la derecha
      vec3 c = mix(vec3(.02, .018, .016), vec3(.09, .075, .06), smoothstep(-.2, .8, rd.y));
      float sb = smoothstep(.93, .97, dot(rd, normalize(vec3(3., 4., 1.5))));
      return c + vec3(1., .96, .9) * sb * 3.;
    }
    const vec3 LE = vec3(1., .93, .82) * 9.;
    // Luz directa: se apunta a la esfera de luz y se comprueba si hay sombra
    vec3 directa(vec3 p, vec3 n) {
      vec3 L = LUZ.xyz - p; float d2 = dot(L, L);
      float cosMax = sqrt(max(0., 1. - LUZ.w * LUZ.w / d2));
      vec2 r = rnd2(); float cosT = mix(cosMax, 1., r.x), sinT = sqrt(1. - cosT * cosT), ph = 2. * PI * r.y;
      vec3 w = normalize(L), u = normalize(cross(abs(w.x) > .9 ? vec3(0,1,0) : vec3(1,0,0), w)), v = cross(w, u);
      vec3 dir = normalize(u * cos(ph) * sinT + v * sin(ph) * sinT + w * cosT);
      float nd = dot(n, dir); if (nd <= 0.) return vec3(0);
      vec3 nn; int m; traza(p + n * 1e-3, dir, nn, m);
      if (m != 5) return vec3(0);
      return LE / PI * nd * 2. * PI * (1. - cosMax);
    }
    vec3 muestra(vec2 px) {
      vec2 uv = (px - uRes * .5) / uRes.y;
      vec3 ro = vec3(0.5, 2.7, 9.8), ta = vec3(-0.12, 0.5, -0.35);
      vec3 ww = normalize(ta - ro), uu = normalize(cross(ww, vec3(0,1,0))), vv = cross(uu, ww);
      vec3 rd = normalize(uv.x * uu + uv.y * vv + 2.3 * ww);
      // Profundidad de campo (lente fina), enfocando al cristal
      float foco = length(CRISTAL.xyz - ro) - .2;
      vec3 fp = ro + rd * foco;
      vec2 ap = rnd2(); float ang = ap.x * 2. * PI, rad = sqrt(ap.y) * .045;
      ro += (uu * cos(ang) + vv * sin(ang)) * rad;
      rd = normalize(fp - ro);

      vec3 luz = vec3(0), att = vec3(1);
      bool dentro = false, especular = true;
      for (int b = 0; b < 8; b++) {
        vec3 n; int m;
        float t = traza(ro, rd, n, m);
        if (m == 0) { luz += att * cielo(rd); break; }
        vec3 p = ro + rd * t;
        if (m == 5) { if (especular) luz += att * LE; break; }
        if (m == 6) { luz += att * mix(vec3(.05, .042, .035), vec3(.11, .09, .07), smoothstep(0., 4., p.y)) * (.8 + .4 * fbm(p * 3.)); break; }
        if (m == 2) {
          // Cristal: Fresnel + refracción, con un leve tinte al atravesarlo
          vec3 nn = dentro ? -n : n;
          float eta = dentro ? 1.5 : 1. / 1.5;
          float c = clamp(-dot(rd, nn), 0., 1.);
          float f0 = .04, F = f0 + (1. - f0) * pow(1. - c, 5.);
          vec3 rf = refract(rd, nn, eta);
          if (dentro) att *= exp(-vec3(.05, .02, .03) * t);
          especular = true;
          if (rnd() < F || dot(rf, rf) == 0.) { rd = reflect(rd, nn); ro = p + nn * 1e-3; }
          else { rd = rf; ro = p - nn * 1e-3; dentro = !dentro; }
          continue;
        }
        if (m == 4) { especular = true; att *= vec3(.95, .93, .9); rd = normalize(reflect(rd, n) + esfera() * .03); ro = p + n * 1e-3; continue; }
        vec3 alb; float rough, f0 = .04;
        if (m == 1) { alb = marmol(p); rough = .08; }
        else {
          // Piel de naranja: poros con ruido que alteran la normal
          vec3 c = m == 3 ? NARANJA.xyz : NARANJA2.xyz;
          vec3 q = (p - c) * 70.;
          float e = .012;
          float d0 = vn(q);
          vec3 g = vec3(vn(q + vec3(e*70.,0,0)), vn(q + vec3(0,e*70.,0)), vn(q + vec3(0,0,e*70.))) - d0;
          n = normalize(n - g * .55);
          float tono = fbm((p - c) * 3.);
          alb = mix(vec3(.78, .13, .005), vec3(.9, .24, .01), tono);
          if (dot(normalize(p - c), vec3(0, 1, 0)) > .985) alb = vec3(.25, .22, .08);
          rough = .35;
        }
        float cF = clamp(dot(-rd, n), 0., 1.);
        float F = f0 + (1. - f0) * pow(1. - cF, 5.);
        ro = p + n * 1e-3;
        if (rnd() < F) { rd = normalize(reflect(rd, n) + esfera() * rough); especular = true; }
        else { att *= alb; luz += att * directa(ro, n); rd = base(n); especular = false; }
        if (b > 3) { float q = max(att.r, max(att.g, att.b)); if (rnd() > q) break; att /= q; }
      }
      return luz;
    }`;
    trazar({ frag, muestras: 200, franjas: 10, expo: 0.95, vineta: .45, grano: .025 }).then(listo);
  </script>
</body>
</html>
