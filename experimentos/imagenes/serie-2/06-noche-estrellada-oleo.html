<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/base.css" />
<script src="../assets/lib.js"></script>
<style>body { background: #101a3a; }</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <script>
    const ctx = canvas2d();
    const r = rng(1889);
    const n = makeNoise(1889);

    // --- La escena "pensada": qué color hay en cada punto ---
    const estrellas = [[130, 150, 34], [330, 90, 22], [470, 250, 26], [690, 120, 20], [140, 460, 24], [420, 520, 18], [610, 380, 22], [900, 520, 16], [300, 330, 14], [790, 300, 14]];
    const luna = [900, 170, 88];
    const remolinos = [[520, 360, 210, 1], [260, 250, 120, -1], [760, 420, 150, 1]];
    const horizonte = (x) => 820 + Math.sin(x * 0.006 + 1) * 60 + Math.sin(x * 0.017) * 18;
    const casas = [];
    for (let i = 0; i < 26; i++) {
      const x = 360 + r() * 560, y = horizonte(x) + 20 + r() * 150;
      casas.push({ x, y, w: 40 + r() * 50, h: 30 + r() * 28 });
    }
    casas.sort((a, b) => a.y - b.y);
    const ciprés = (x, y) => {
      const cx = 170 + Math.sin(y * 0.02) * 12, top = 150, base = 1350;
      if (y < top || y > base) return false;
      const t = (y - top) / (base - top);
      const ancho = 150 * Math.sin(Math.min(1, t * 1.25) * Math.PI * 0.5) * (1 - t * 0.25) + Math.sin(y * 0.05) * 12;
      return Math.abs(x - cx) < ancho;
    };
    const lerpC = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
    function color(x, y) {
      if (ciprés(x, y)) return lerpC([18, 44, 32], [52, 78, 48], n(x * 0.02, y * 0.01) * 1.3);
      for (const c of casas) {
        if (x > c.x && x < c.x + c.w && y > c.y - c.h && y < c.y) {
          const vent = (Math.floor((x - c.x) / 12) % 3 === 1) && y > c.y - c.h * 0.6 && y < c.y - c.h * 0.3;
          return vent ? [242, 196, 78] : lerpC([196, 204, 226], [150, 160, 200], (x - c.x) / c.w);
        }
        if (x > c.x - 4 && x < c.x + c.w + 4 && y > c.y - c.h - 10 && y < c.y - c.h) return [150, 70, 50];
      }
      // Torre de la iglesia
      if (x > 640 && x < 690 && y > 640 && y < 900) return y < 700 ? [236, 200, 110] : [200, 208, 230];
      const hy = horizonte(x);
      if (y > hy) return lerpC([34, 64, 108], [40, 84, 70], Math.min(1, (y - hy) / 300) + n(x * 0.01, y * 0.01) * 0.3);
      // Cielo con estrellas y luna
      const dl = Math.hypot(x - luna[0], y - luna[1]);
      if (dl < luna[2]) {
        const dl2 = Math.hypot(x - luna[0] - 38, y - luna[1] + 20);
        return dl2 < luna[2] * 0.85 ? [48, 70, 140] : [245, 206, 72];
      }
      if (dl < luna[2] * 1.9) return lerpC([240, 214, 110], [70, 100, 170], (dl - luna[2]) / (luna[2] * 0.9));
      for (const [sx, sy, sr] of estrellas) {
        const d = Math.hypot(x - sx, y - sy);
        if (d < sr * 0.45) return [255, 250, 215];
        if (d < sr) return [245, 215, 80];
        if (d < sr * 2.1) return lerpC([236, 214, 110], [90, 130, 200], (d - sr) / (sr * 1.1));
      }
      const banda = n(x * 0.004 + 3, y * 0.009, 3);
      const base = lerpC([22, 38, 110], [70, 110, 190], Math.min(1, y / 820 * 0.7 + banda * 0.5));
      return banda > 0.56 ? lerpC(base, [175, 205, 235], Math.min(1, (banda - 0.56) * 3.2)) : base;
    }
    // --- Hacia dónde va la pincelada en cada punto ---
    function angulo(x, y) {
      if (ciprés(x, y)) return -Math.PI / 2 + Math.sin(y * 0.03 + x * 0.05) * 0.5;
      const hy = horizonte(x);
      if (y > hy - 5) return Math.sin(x * 0.006 + 1) * 0.35 + (n(x * 0.01, y * 0.01) - 0.5) * 0.8;
      let vx = 1.0, vy = Math.sin(x * 0.01 + y * 0.004) * 0.4;
      for (const [cx, cy, rad, s] of remolinos) {
        const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy);
        const k = Math.exp(-((d / rad) ** 2)) * 3.5 * s;
        vx += (-dy / (d + 1)) * k; vy += (dx / (d + 1)) * k;
      }
      for (const [sx, sy, sr] of [...estrellas, luna]) {
        const dx = x - sx, dy = y - sy, d = Math.hypot(dx, dy);
        const k = Math.exp(-((d / (sr * 2.4)) ** 2)) * 5;
        vx += (-dy / (d + 1)) * k; vy += (dx / (d + 1)) * k;
      }
      return Math.atan2(vy, vx);
    }
    // --- Pintar ---
    ctx.fillStyle = "#1a2656"; ctx.fillRect(0, 0, W, H);
    ctx.lineCap = "round";
    function pincelada(x, y, largo, ancho) {
      const base = color(x, y);
      const j = () => (r() - 0.5) * 26;
      const cerdas = 5;
      for (let b = 0; b < cerdas; b++) {
        const off = (b / (cerdas - 1) - 0.5) * ancho;
        const col = base.map((v) => Math.max(0, Math.min(255, v + j() * 0.7)));
        const luz = 0.85 + r() * 0.3;
        ctx.strokeStyle = `rgb(${col[0] * luz | 0},${col[1] * luz | 0},${col[2] * luz | 0})`;
        ctx.lineWidth = ancho / cerdas * (1.2 + r() * 0.8);
        ctx.beginPath();
        let a = angulo(x, y);
        let px = x - Math.sin(a) * off, py = y + Math.cos(a) * off;
        ctx.moveTo(px, py);
        const pasos = 4;
        for (let s = 0; s < pasos; s++) {
          a = angulo(px, py);
          px += Math.cos(a) * largo / pasos; py += Math.sin(a) * largo / pasos;
          ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    }
    const capas = [[44, 16, 9000], [30, 11, 30000], [20, 7, 52000]];
    for (const [largo, ancho, num] of capas) {
      for (let i = 0; i < num; i++) pincelada(r() * W, r() * H, largo * (0.7 + r() * 0.6), ancho * (0.8 + r() * 0.4));
    }
    // Detalle fino en estrellas, ventanas y luna
    for (let i = 0; i < 14000; i++) {
      const [sx, sy, sr] = i % 11 === 0 ? luna : estrellas[i % estrellas.length];
      const a = r() * Math.PI * 2, d = Math.sqrt(r()) * sr * 2.2;
      pincelada(sx + Math.cos(a) * d, sy + Math.sin(a) * d, 12, 5);
    }
    for (const c of casas) for (let i = 0; i < 40; i++) pincelada(c.x + r() * c.w, c.y - r() * c.h, 9, 5);
    // Textura de lienzo
    const img = ctx.getImageData(0, 0, W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const k = (y * W + x) * 4;
      const t = ((x % 4 < 2) !== (y % 4 < 2) ? 1.04 : 0.97) * (0.96 + r() * 0.08);
      img.data[k] *= t; img.data[k + 1] *= t; img.data[k + 2] *= t;
    }
    ctx.putImageData(img, 0, 0);
    listo();
  </script>
</body>
</html>
