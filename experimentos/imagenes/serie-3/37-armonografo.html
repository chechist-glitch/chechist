<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/base.css" />
<script src="../assets/lib.js"></script>
<script src="../assets/mas.js"></script>
<style>body { background: #f2ecdf; }</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <script>
    // Armonógrafo: dos péndulos mueven el papel y otro la plumilla. Cada trazo es la suma
    // de senos que se van apagando; relaciones casi exactas (2:3, 3:4) y un pelín desafinadas.
    (async () => {
      await M.fuentes('italic 24px "Fraunces"', '16px "Plex Mono"');
      const ctx = canvas2d();
      M.porPixel(ctx, (x, y) => [242, 236, 223]);
      M.papel(ctx, 1.2, 9);
      function dibujo(cx, cy, esc, p, color, ancho) {
        const { f1, f2, f3, f4, d1, d2, p1, p2, p3, p4 } = p;
        ctx.strokeStyle = color;
        ctx.lineWidth = ancho;
        ctx.beginPath();
        const T = 260, dt = 0.004;
        for (let t = 0; t < T; t += dt) {
          const e1 = Math.exp(-d1 * t), e2 = Math.exp(-d2 * t);
          const x = Math.sin(f1 * t + p1) * e1 + Math.sin(f2 * t + p2) * e2;
          const y = Math.sin(f3 * t + p3) * e1 + Math.sin(f4 * t + p4) * e2;
          const px = cx + x * esc, py = cy + y * esc;
          t === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
      ctx.globalCompositeOperation = "multiply";
      dibujo(540, 600, 215, { f1: 2, f2: 3.004, f3: 3, f4: 2.001, d1: 0.006, d2: 0.009, p1: 0, p2: 0.8, p3: 1.57, p4: 0.3 }, "rgba(30,50,140,.32)", 0.8);
      dibujo(540, 600, 190, { f1: 3, f2: 4.003, f3: 4, f4: 3.002, d1: 0.008, d2: 0.007, p1: 0.4, p2: 0, p3: 0, p4: 1.2 }, "rgba(190,40,40,.3)", 0.8);
      dibujo(540, 600, 120, { f1: 1, f2: 2.002, f3: 1.001, f4: 3, d1: 0.01, d2: 0.012, p1: 1.57, p2: 0, p3: 0, p4: 0.6 }, "rgba(20,20,20,.35)", 0.7);
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#2b2b2b";
      ctx.font = 'italic 26px "Fraunces"';
      ctx.textAlign = "center";
      ctx.fillText("Armonógrafo de tres péndulos", 540, 1180);
      ctx.font = '16px "Plex Mono"';
      ctx.fillStyle = "#555";
      ctx.fillText("azul 2:3 · rojo 3:4 · negro 1:2:3 · amortiguación 0,006–0,012 · plumilla 0,3 mm", 540, 1214);
      ctx.fillText("tinta china y tinta de sello sobre papel verjurado", 540, 1240);
      listo();
    })();
  </script>
</body>
</html>
