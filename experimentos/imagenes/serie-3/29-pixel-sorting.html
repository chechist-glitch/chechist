<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/base.css" />
<script src="../assets/lib.js"></script>
<script src="../assets/mas.js"></script>
<style>body { background: #120a14; }</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <script>
    // Ordenación de píxeles: se pinta un atardecer en Cádiz y luego, columna a columna,
    // los tramos con brillo medio se reordenan de oscuro a claro. Las siluetas frenan la ordenación.
    const ctx = canvas2d();
    const r = rng(1812);
    const n = makeNoise(1812);
    const HOR = 860;
    const cielo = M.rampa([[0, "#241650"], [0.35, "#6b2475"], [0.6, "#c2407a"], [0.8, "#f28c38"], [1, "#ffd27a"]]);
    M.porPixel(ctx, (x, y) => {
      if (y < HOR) {
        let c = cielo(y / HOR);
        const d = Math.hypot(x - 620, y - 770);
        if (d < 86) return [255, 244, 205];
        c = M.mezcla(c, [255, 220, 150], Math.exp(-d / 160) * 0.8);
        const nube = n(x * 0.0025, y * 0.028, 4);
        if (nube > 0.56) {
          const borde = n(x * 0.0025, (y + 10) * 0.028, 4) < 0.56 ? 1 : 0;
          c = M.mezcla(c, borde ? [255, 190, 130] : [70, 28, 70], M.clamp((nube - 0.56) * 6));
        }
        return c;
      }
      const prof = (y - HOR) / (H - HOR);
      let c = M.mezcla([90, 40, 90], [14, 18, 45], prof);
      const brillo = Math.exp(-Math.abs(x - 620) / (40 + prof * 200)) * (n(x * 0.05, y * 0.4, 2) > 0.5 ? 1 : 0.2);
      return M.mezcla(c, [255, 200, 120], brillo);
    });
    // Siluetas: catedral, casas y palmeras
    ctx.fillStyle = "#120a14";
    ctx.beginPath();
    ctx.moveTo(0, HOR);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, HOR - 60 - Math.floor(n(x * 0.02, 3, 1) * 5) * 18);
    ctx.lineTo(W, HOR + 6);
    ctx.lineTo(0, HOR + 6);
    ctx.fill();
    ctx.fillRect(250, HOR - 250, 220, 250);
    ctx.beginPath();
    ctx.ellipse(360, HOR - 250, 95, 130, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(352, HOR - 420, 16, 50);
    ctx.fillRect(210, HOR - 360, 50, 360);
    ctx.fillRect(460, HOR - 360, 50, 360);
    for (const x of [235, 485]) { ctx.beginPath(); ctx.ellipse(x, HOR - 360, 25, 40, 0, Math.PI, 0); ctx.fill(); }
    function palmera(x, alto) {
      ctx.strokeStyle = "#120a14";
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.moveTo(x, HOR);
      ctx.quadraticCurveTo(x + 30, HOR - alto * 0.5, x + 10, HOR - alto);
      ctx.stroke();
      for (let k = 0; k < 9; k++) {
        const a = -Math.PI / 2 + (k - 4) * 0.38;
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(x + 10, HOR - alto);
        ctx.quadraticCurveTo(x + 10 + Math.cos(a) * 80, HOR - alto + Math.sin(a) * 60 - 20, x + 10 + Math.cos(a) * 130, HOR - alto + Math.sin(a) * 40 + 40);
        ctx.stroke();
      }
    }
    palmera(760, 330);
    palmera(900, 260);
    palmera(80, 290);

    // --- Ordenación ---
    const img = ctx.getImageData(0, 0, W, H);
    const d = img.data;
    const lum = (k) => (d[k] * 0.3 + d[k + 1] * 0.59 + d[k + 2] * 0.11) / 255;
    for (let x = 0; x < W; x++) {
      const lo = 0.16 + n(x * 0.01, 0.5, 2) * 0.22;
      const hi = 0.985;
      let y = 0;
      while (y < H) {
        while (y < H && !(lum((y * W + x) * 4) > lo && lum((y * W + x) * 4) < hi)) y++;
        const y0 = y;
        while (y < H && lum((y * W + x) * 4) > lo && lum((y * W + x) * 4) < hi) y++;
        if (y - y0 > 3) {
          const tramo = [];
          for (let yy = y0; yy < y; yy++) { const k = (yy * W + x) * 4; tramo.push([d[k], d[k + 1], d[k + 2]]); }
          tramo.sort((a, b) => b[0] * 0.3 + b[1] * 0.59 + b[2] * 0.11 - (a[0] * 0.3 + a[1] * 0.59 + a[2] * 0.11));
          tramo.forEach((c, i) => { const k = ((y0 + i) * W + x) * 4; d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; });
        }
      }
    }
    // Una franja ordenada en horizontal y bandas con desplazamiento de canales
    for (let y = 1000; y < 1080; y++) {
      const fila = [];
      for (let x = 0; x < W; x++) { const k = (y * W + x) * 4; fila.push([d[k], d[k + 1], d[k + 2]]); }
      fila.sort((a, b) => b[0] + b[1] + b[2] - (a[0] + a[1] + a[2]));
      fila.forEach((c, x) => { const k = (y * W + x) * 4; d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; });
    }
    const copia = new Uint8ClampedArray(d);
    for (let b = 0; b < 7; b++) {
      const y0 = Math.floor(r() * H), alto = 6 + Math.floor(r() * 30), off = Math.floor((r() - 0.5) * 60);
      for (let y = y0; y < Math.min(H, y0 + alto); y++) for (let x = 0; x < W; x++) {
        const k = (y * W + x) * 4, k2 = (y * W + Math.min(W - 1, Math.max(0, x + off))) * 4;
        d[k] = copia[k2];
      }
    }
    ctx.putImageData(img, 0, 0);
    listo();
  </script>
</body>
</html>
