<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/base.css" />
<script src="../assets/lib.js"></script>
<script src="../assets/gl.js"></script>
<style>
  body { background: #000; }
  .t { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; font-family: "Anton"; font-size: 64px; letter-spacing: 6px; color: #fff; mix-blend-mode: screen; }
  .t span:first-child { color: #ff2a2a; margin-right: -4px; }
  .t span:last-child { color: #16e6ff; }
  .s { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-family: "Plex Mono"; font-size: 18px; color: #cfd6da; letter-spacing: 3px; }
</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <div class="t"><span>PONTE LAS GAFAS</span> <span>3D</span></div>
  <div class="s">rojo en el ojo izquierdo · cian en el derecho</div>
  <script>
    // Bosque de columnas de la Mezquita de Córdoba en raymarching, renderizado dos veces
    // (un ojo por canal): rojo = ojo izquierdo, cian = ojo derecho
    trazar({
      muestras: 12,
      tono: false,
      vineta: 0.35,
      grano: 0.02,
      frag: `
      float caja(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.); }
      float h21(vec2 p) { vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
      const float SX = 2.2, SZ = 1.7;
      // material: 1 suelo, 2 columna, 3 muro/arco, 4 techo
      vec2 escena(vec3 p) {
        vec2 m = vec2(p.y, 1.);
        float techo = 4.6 - p.y;
        if (techo < m.x) m = vec2(techo, 4.);
        float xc = (floor(p.x / SX) + .5) * SX;
        float zc = floor(p.z / SZ + .5) * SZ;
        vec3 q = vec3(p.x - xc, p.y, p.z - zc);
        // columna y capitel
        float col = max(length(q.xz) - .14, p.y - 1.95);
        col = min(col, caja(q - vec3(0., 2.02, 0.), vec3(.2, .08, .2)));
        col = min(col, caja(q - vec3(0., .06, 0.), vec3(.19, .06, .19)));
        if (col < m.x) m = vec2(col, 2.);
        // muro de arcos (en el plano z-y, grosor en x)
        vec2 w = vec2(p.z - (floor(p.z / SZ) + .5) * SZ, p.y);
        float muro = max(abs(q.x) - .16, max(2.08 - p.y, p.y - 4.6));
        // hueco inferior: arco de herradura
        float circ = length(w - vec2(0., 2.55)) - .7;
        float rect = max(abs(w.x) - .6, w.y - 2.55);
        float hueco = min(circ, rect);
        // hueco superior: arco de medio punto
        float h2 = min(length(w - vec2(0., 3.75)) - .48, max(abs(w.x) - .48, max(w.y - 3.75, 3.28 - w.y)));
        muro = max(muro, -min(hueco, h2));
        // pilar entre arcos superiores
        if (muro < m.x) m = vec2(muro, 3.);
        return m;
      }
      vec3 normal(vec3 p) { vec2 e = vec2(.002, 0.); return normalize(vec3(escena(p + e.xyy).x - escena(p - e.xyy).x, escena(p + e.yxy).x - escena(p - e.yxy).x, escena(p + e.yyx).x - escena(p - e.yyx).x)); }
      float oclusion(vec3 p, vec3 n) { float o = 0., s = 1.; for (int i = 1; i <= 5; i++) { float d = .08 * float(i); o += (d - escena(p + n * d).x) * s; s *= .7; } return clamp(1. - 1.8 * o, 0., 1.); }

      float ojo(vec3 ro, vec3 rd) {
        float t = .05; vec2 h;
        bool ok = false;
        for (int i = 0; i < 180; i++) {
          h = escena(ro + rd * t);
          if (h.x < .0008 * t) { ok = true; break; }
          t += h.x * .9;
          if (t > 45.) break;
        }
        if (!ok) return .32;
        vec3 p = ro + rd * t;
        vec3 n = normal(p);
        float alb = .6;
        if (h.y < 1.5) alb = .35 + .1 * step(.5, fract((floor(p.x * 1.2) + floor(p.z * 1.2)) * .5));
        else if (h.y < 2.5) alb = .55;
        else if (h.y < 3.5) {
          // dovelas: franjas rojas (oscuras) y blancas alternando alrededor del arco
          vec2 w = vec2(p.z - (floor(p.z / SZ) + .5) * SZ, p.y);
          float a = atan(w.y - 2.55, w.x);
          float b = atan(w.y - 3.75, w.x);
          float franja = p.y < 3.25 ? step(.5, fract(a * 10. / 3.1416)) : step(.5, fract(b * 8. / 3.1416));
          alb = mix(.72, .26, franja);
        } else alb = .22 + .06 * step(.5, fract(p.x * 4.));
        vec3 L = normalize(vec3(-.3, .8, .4));
        float dif = .35 + .65 * max(dot(n, L), 0.);
        float ao = oclusion(p, n);
        float niebla = exp(-t * .075);
        // luz que entra desde el patio al fondo
        float fondo = smoothstep(20., 40., t) * .25;
        return alb * dif * ao * niebla + fondo * (1. - niebla);
      }

      vec3 muestra(vec2 px) {
        vec2 uv = (px - uRes * .5) / uRes.y;
        vec3 ro = vec3(.05, 1.55, 18.);
        vec3 ta = vec3(-1.6, 2.1, 0.);
        vec3 w = normalize(ta - ro), u = normalize(cross(w, vec3(0, 1, 0))), v = cross(u, w);
        vec3 rd = normalize(uv.x * u + uv.y * v + 1.25 * w);
        // Dos ojos separados 6,5 cm (escala) que convergen a 5 unidades
        float sep = .09, conv = 5.;
        vec3 pf = ro + rd * conv / dot(rd, w);
        vec3 roL = ro - u * sep * .5, roR = ro + u * sep * .5;
        float L = ojo(roL, normalize(pf - roL));
        float R = ojo(roR, normalize(pf - roR));
        vec3 c = vec3(L * 1.15, R, R);
        return pow(c, vec3(1.)) ;
      }`,
    }).then(listo);
  </script>
</body>
</html>
