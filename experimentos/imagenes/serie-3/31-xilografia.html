<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/base.css" />
<script src="../assets/lib.js"></script>
<script src="../assets/mas.js"></script>
<style>body { background: #efe6d2; }</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <script>
    // Xilografía: cada zona tiene su dirección de talla (círculos en el sol, curvas de nivel
    // en la sierra, surcos en el campo) y el grosor de la línea sale de lo oscura que es la escena
    (async () => {
      await M.fuentes('64px "Anton"', '40px "DM Serif"');
      const ctx = canvas2d();
      const n = makeNoise(1867);
      const M0 = 70, TIT = 150;
      const SX = 760, SY = 330, SR = 105;
      const cresta1 = (x) => 620 - 190 * n(x * 0.0028, 1.3, 3);
      const cresta2 = (x) => 850 - 150 * n(x * 0.004 + 5, 2.1, 3);
      const campo = 1010;

      // Olivo: tronco retorcido y copa de bolas con ruido
      const bolas = [[250, 720, 150], [150, 790, 110], [360, 780, 120], [260, 840, 110], [110, 700, 80], [390, 690, 90]];
      function copa(x, y) {
        let d = 1e9;
        for (const [cx, cy, rr] of bolas) d = Math.min(d, Math.hypot(x - cx, y - cy) - rr * (0.85 + 0.3 * n(x * 0.02, y * 0.02, 2)));
        return d;
      }
      function tronco(x, y) {
        if (y < 780 || y > 1150) return 1e9;
        const t = (y - 780) / 370;
        const cx = 250 + Math.sin(t * 5) * 30 - t * 20;
        return Math.abs(x - cx) - (22 + t * 30 + Math.sin(y * 0.05) * 6);
      }

      // Escena: luminancia y fase (dirección de las líneas talladas)
      function escena(x, y) {
        const dsol = Math.hypot(x - SX, y - SY);
        if (copa(x, y) < 0 || tronco(x, y) < 0) {
          // negro macizo con marcas de gubia
          const marca = Math.abs(Math.sin((x * 0.7 + y * 0.35) * 0.08 + n(x * 0.03, y * 0.03, 2) * 6));
          const gubia = marca > 0.985 && n(x * 0.05, y * 0.05, 2) > 0.55;
          return [gubia ? 0.9 : 0.02, x + y];
        }
        if (y < cresta1(x)) {
          if (dsol < SR) return [dsol > SR - 8 ? 0.2 : 1, 0];
          const L = 0.5 + 0.45 * Math.exp(-(dsol - SR) / 260) - y / 2000;
          return [L, dsol / 11];
        }
        if (y < cresta2(x)) {
          const pend = cresta1(x + 3) - cresta1(x - 3);
          const L = 0.7 + pend * 0.025 - (y - cresta1(x)) / 1400;
          return [L, (y - cresta1(x)) / 9 + n(x * 0.01, 3, 2) * 2];
        }
        if (y < campo) {
          const pend = cresta2(x + 3) - cresta2(x - 3);
          const L = 0.3 + pend * 0.025 - (y - cresta2(x)) / 900;
          return [L, (y - cresta2(x)) / 8 + n(x * 0.012, 7, 2) * 2];
        }
        // campo arado: surcos que convergen hacia el horizonte
        const L = 0.6 - (y - campo) / 700 + 0.12 * n(x * 0.01, y * 0.01, 2);
        return [L, Math.log(y - campo + 25) * 16 + Math.sin(x * 0.01) * 0.6];
      }
      const EP = 1.2;
      M.porPixel(ctx, (x, y) => {
        const papel = 0.97 + (n(x * 0.4, y * 0.02, 2) - 0.5) * 0.06;
        const P = [239 * papel, 230 * papel, 210 * papel];
        const dentro = x > M0 && x < W - M0 && y > M0 && y < H - M0 - TIT;
        if (!dentro) {
          const marco = x > M0 - 14 && x < W - M0 + 14 && y > M0 - 14 && y < H - M0 + 14;
          if (marco) return [22, 18, 16];
          return P;
        }
        let [L, fase] = escena(x, y);
        fase += (n(x * 0.02, y * 0.02, 2) - 0.5) * 0.9;
        const f = Math.abs((fase % 1 + 1) % 1 - 0.5);
        const ancho = M.clamp(1 - L) * 0.5;
        const tinta = M.smooth(ancho + 0.06, ancho - 0.02, f) * (L < 0.97 ? 1 : 0);
        const veta = 0.86 + 0.14 * n(x * 0.01, y * 0.5, 2);
        const ink = [22, 18, 16];
        return M.mezcla(P, ink, tinta * veta);
      }, 2);

      // Cartela tallada con el título
      ctx.fillStyle = "#16120f";
      ctx.fillRect(M0, H - M0 - TIT, W - M0 * 2, TIT + 14);
      ctx.fillStyle = "#efe6d2";
      ctx.font = '64px "Anton"';
      ctx.textAlign = "center";
      ctx.fillText("SIERRA DE GRAZALEMA", W / 2, H - M0 - 60);
      ctx.font = 'italic 26px "DM Serif"';
      ctx.fillText("grabado en madera de peral · tirada de 12", W / 2, H - M0 - 20);
      // sello rojo
      ctx.fillStyle = "#c0282d";
      ctx.fillRect(W - M0 - 90, H - M0 - TIT - 110, 70, 70);
      ctx.fillStyle = "#efe6d2";
      ctx.font = '48px "DM Serif"';
      ctx.fillText("Q", W - M0 - 55, H - M0 - TIT - 58);
      listo();
    })();
  </script>
</body>
</html>
