<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/base.css" />
<script src="../assets/lib.js"></script>
<script src="../assets/gl.js"></script>
<style>body { background: #2a3a5a; }</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <script>
    // Nubes volumétricas: el rayo atraviesa un campo de densidad 3D y en cada paso se mira
    // cuánta luz del sol llega (Beer–Lambert), con dispersión hacia delante (Henyey–Greenstein)
    // y el efecto "polvo" que oscurece el interior. Atardecer con el sol detrás de los cúmulos.
    trazar({
      muestras: 6,
      tono: true,
      expo: 1.05,
      vineta: 0.25,
      grano: 0.012,
      frag: `
      float h31(vec3 p) { p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
      float vn3(vec3 p) { vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
        return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
                   mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z); }
      float fbm(vec3 p, int oct) { float s = 0., a = .5; for (int i = 0; i < 5; i++) { if (i >= oct) break; s += a * vn3(p); p = p * 2.07 + vec3(1.3, .2, 2.1); a *= .5; } return s; }
      const vec3 SOL = normalize(vec3(.55, .28, .8));
      float densidad(vec3 p, int oct) {
        // cúmulos: un mapa 2D dice dónde hay nube y lo alta que sube; la base es plana a 1,2 km
        float cob = smoothstep(.46, .66, fbm(vec3(p.xz * .55, 0.), 3));
        if (cob <= 0.) return 0.;
        float base = 1.2, cima = 1.28 + 0.75 * cob;
        float h = (p.y - base) / (cima - base);
        if (h < 0. || h > 1.) return 0.;
        float perfil = smoothstep(0., .08, h) * (1. - h * h);
        vec3 q = p * 3.1 + vec3(0., -p.y * 1.2, 0.);
        float b = 0., a = .5;
        for (int i = 0; i < 5; i++) { if (i >= oct) break; b += a * abs(vn3(q) * 2. - 1.); q = q * 2.13 + 3.7; a *= .5; }
        float d = cob * perfil - .34 * b + .07;
        return clamp(d * 9., 0., 1.);
      }
      float hg(float c, float g) { float g2 = g * g; return (1. - g2) / (4. * PI * pow(1. + g2 - 2. * g * c, 1.5)); }
      vec3 cielo(vec3 rd) {
        float s = max(dot(rd, SOL), 0.);
        vec3 c = mix(vec3(1., .62, .32), vec3(.08, .2, .5), pow(clamp(rd.y + .02, 0., 1.), .35));
        c += vec3(1., .55, .25) * pow(s, 8.) * .35 + vec3(1., .85, .6) * pow(s, 900.) * 30.;
        return c;
      }
      vec3 muestra(vec2 px) {
        vec2 uv = (px - uRes * .5) / uRes.y;
        vec3 ro = vec3(0., .6, 0.);
        vec3 w = normalize(vec3(0., .3, 1.)), u = normalize(cross(w, vec3(0, 1, 0))), v = cross(u, w);
        vec3 rd = normalize(uv.x * u + uv.y * v + 1.2 * w);
        vec3 fondo = cielo(rd);
        if (rd.y < 0.) {
          // mar abajo, reflejando el cielo
          vec3 rf = reflect(rd, vec3(0., 1., 0.));
          return mix(vec3(.02, .06, .14), cielo(rf) * .5, .3 + .5 * pow(1. + rd.y, 8.));
        }
        float t0 = (1.2 - ro.y) / rd.y, t1 = min((2.05 - ro.y) / rd.y, t0 + 5.);
        if (t0 > 14.) return fondo;
        const int PASOS = 56;
        float dt = (t1 - t0) / float(PASOS);
        float t = t0 + dt * rnd();
        float T = 1.;
        vec3 luz = vec3(0.);
        float cosA = dot(rd, SOL);
        float fase = mix(hg(cosA, .6), hg(cosA, -.2), .3);
        for (int i = 0; i < PASOS; i++) {
          vec3 p = ro + rd * t;
          float d = densidad(p, 4);
          if (d > .01) {
            // luz que llega del sol: pocos pasos hacia él
            float od = 0.;
            for (int k = 1; k <= 5; k++) od += densidad(p + SOL * float(k) * .06, 2) * .06;
            float beer = exp(-od * 16.);
            float polvo = 1. - exp(-d * 6.);
            vec3 ilum = vec3(1., .78, .55) * 14. * beer * polvo * fase + vec3(.22, .3, .5) * .3 * (.25 + .75 * smoothstep(1.2, 2.1, p.y));
            float a = 1. - exp(-d * dt * 14.);
            luz += T * a * ilum;
            T *= 1. - a;
            if (T < .02) break;
          }
          t += dt;
        }
        float niebla = 1. - exp(-t0 * .12);
        vec3 col = fondo * T + luz;
        return mix(col, fondo, niebla * .6);
      }`,
    }).then(listo);
  </script>
</body>
</html>
