<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/base.css" />
<script src="../assets/lib.js"></script>
<style>
  body { background: #0b0a10; }
  .t { position: absolute; left: 0; right: 0; bottom: 60px; text-align: center; font-family: "Fraktur"; font-weight: 700; font-size: 80px; color: #e9c46a; }
  .t small { display: block; font-family: "Space Mono"; font-size: 20px; color: #8d99ae; }
</style>
</head>
<body>
  <canvas id="c" class="full"></canvas>
  <div class="t">Rosetón<small>diagrama de Voronoi · cada cristal es la zona más cercana a un punto</small></div>
  <script>
    const ctx = canvas2d();
    const r = rng(1248);
    const cx = 540, cy = 590, R = 480;
    // Semillas en anillos con simetría radial de 12
    const semillas = [{ x: cx, y: cy, c: 0 }];
    const anillos = [70, 150, 235, 320, 400, 460];
    anillos.forEach((rad, i) => {
      const n = 12 * (i < 2 ? 1 : 2);
      const off = r() * Math.PI;
      for (let k = 0; k < n; k++) {
        const a = off + (k / n) * Math.PI * 2;
        semillas.push({ x: cx + Math.cos(a) * rad, y: cy + Math.sin(a) * rad, c: (i + (k % 2)) % 6 });
      }
    });
    const vidrio = [[190, 30, 45], [20, 60, 160], [230, 170, 40], [30, 120, 70], [120, 30, 120], [220, 90, 30]];
    const img = ctx.createImageData(W, H);
    const d = img.data;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const dist = Math.hypot(x - cx, y - cy);
      const i = (y * W + x) * 4;
      if (dist > R) { d[i] = 11; d[i + 1] = 10; d[i + 2] = 16; d[i + 3] = 255; continue; }
      let b1 = Infinity, b2 = Infinity, bi = 0;
      for (let s = 0; s < semillas.length; s++) {
        const dx = x - semillas[s].x, dy = y - semillas[s].y, dd = dx * dx + dy * dy;
        if (dd < b1) { b2 = b1; b1 = dd; bi = s; } else if (dd < b2) b2 = dd;
      }
      const borde = Math.sqrt(b2) - Math.sqrt(b1);
      if (borde < 5 || dist > R - 12) { d[i] = 25; d[i + 1] = 22; d[i + 2] = 28; d[i + 3] = 255; continue; }
      const c = vidrio[semillas[bi].c];
      const brillo = 0.55 + 0.6 * Math.max(0, 1 - Math.sqrt(b1) / 90) + 0.25 * (1 - dist / R);
      d[i] = Math.min(255, c[0] * brillo); d[i + 1] = Math.min(255, c[1] * brillo); d[i + 2] = Math.min(255, c[2] * brillo); d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    // Resplandor de luz atravesando
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(cx - 120, cy - 160, 20, cx, cy, R);
    g.addColorStop(0, "rgba(255,240,200,.35)"); g.addColorStop(1, "rgba(255,240,200,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    listo();
  </script>
</body>
</html>
