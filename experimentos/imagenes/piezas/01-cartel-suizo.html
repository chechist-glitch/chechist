<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/base.css" />
<script src="../assets/lib.js"></script>
<style>
  body { background: #efebe1; color: #111; }
  .rejilla { position: absolute; inset: 0; background-image: linear-gradient(90deg, rgba(0,0,0,.08) 1px, transparent 1px); background-size: 90px 100%; }
  .rojo { position: absolute; left: 540px; top: 0; width: 540px; height: 820px; background: #e3261c; }
  .circulo { position: absolute; left: 610px; top: 140px; width: 400px; height: 400px; border-radius: 50%; background: #111; }
  .palabra { position: absolute; left: 60px; font-family: "Anton"; font-size: 410px; line-height: .8; letter-spacing: -8px; text-transform: uppercase; }
  .p1 { top: 70px; }
  .p2 { top: 400px; color: #efebe1; mix-blend-mode: difference; }
  .info { position: absolute; left: 60px; bottom: 60px; width: 960px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 30px; font-size: 22px; line-height: 1.35; border-top: 6px solid #111; padding-top: 22px; }
  .info b { display: block; font-weight: 800; font-size: 26px; margin-bottom: 6px; }
  .num { position: absolute; right: 60px; top: 870px; font-family: "Anton"; font-size: 150px; line-height: 1; color: #e3261c; }
</style>
</head>
<body>
  <div class="rejilla"></div>
  <div class="rojo"></div>
  <div class="circulo"></div>
  <div class="palabra p1">Sevi</div>
  <div class="palabra p2">lla</div>
  <div class="num">41°N</div>
  <div class="info">
    <div><b>Estilo suizo</b>Rejilla, tipografía enorme y rojo. Nada más.</div>
    <div><b>Técnica</b>CSS puro: bloques, un círculo y mix-blend-mode.</div>
    <div><b>Temperatura</b>Agosto. No preguntes.</div>
  </div>
  <script>listo();</script>
</body>
</html>
