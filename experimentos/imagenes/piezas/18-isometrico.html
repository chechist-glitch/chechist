<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/base.css" />
<script src="../assets/lib.js"></script>
<style>
  body { background: linear-gradient(#8fd3f4, #d8f1fb 70%); }
  svg { position: absolute; inset: 0; }
  .t { position: absolute; left: 60px; top: 60px; font-family: "Archivo Black"; font-size: 76px; line-height: .95; color: #0f4c75; }
  .t small { display: block; font-family: "Space Mono"; font-size: 20px; margin-top: 12px; color: #0f4c75; }
</style>
</head>
<body>
  <svg id="s" width="1080" height="1350"></svg>
  <div class="t">Mijas,<br />vista de dron<small>proyección isométrica · SVG generado</small></div>
  <script>
    const r = rng(29650);
    const U = 36;
    const iso = (x, y, z) => [540 + (x - y) * U * 0.866, 440 + (x + y) * U * 0.5 - z * U];
    const pts = (a) => a.map((p) => iso(...p).join(",")).join(" ");
    let out = "";
    // Colina
    const N = 16;
    const altura = (x, y) => Math.max(0, 5 - Math.hypot(x - 6, y - 6) * 0.55) | 0;
    const celdas = [];
    for (let s = 0; s < N * 2; s++) for (let x = 0; x < N; x++) { const y = s - x; if (y >= 0 && y < N) celdas.push([x, y]); }
    for (const [x, y] of celdas) {
      const h = altura(x, y);
      const top = [[x, y, h], [x + 1, y, h], [x + 1, y + 1, h], [x, y + 1, h]];
      out += `<polygon points="${pts([[x, y + 1, 0], [x + 1, y + 1, 0], [x + 1, y + 1, h], [x, y + 1, h]])}" fill="#b98d4f"/>`;
      out += `<polygon points="${pts([[x + 1, y, 0], [x + 1, y + 1, 0], [x + 1, y + 1, h], [x + 1, y, h]])}" fill="#9c7440"/>`;
      out += `<polygon points="${pts(top)}" fill="${(x + y) % 2 ? "#d9b77a" : "#d2ae70"}" stroke="#c9a266" stroke-width="1"/>`;
      // Casa
      const tipo = r();
      if (tipo < 0.55 && !(x > 12 && y < 3)) {
        const ch = 1 + Math.floor(r() * 2), b = h, m = 0.12;
        const X0 = x + m, X1 = x + 1 - m, Y0 = y + m, Y1 = y + 1 - m;
        out += `<polygon points="${pts([[X0, Y1, b], [X1, Y1, b], [X1, Y1, b + ch], [X0, Y1, b + ch]])}" fill="#f6f4ee"/>`;
        out += `<polygon points="${pts([[X1, Y0, b], [X1, Y1, b], [X1, Y1, b + ch], [X1, Y0, b + ch]])}" fill="#dcd8cc"/>`;
        out += `<polygon points="${pts([[X0 + .3, Y1, b], [X0 + .52, Y1, b], [X0 + .52, Y1, b + .62], [X0 + .3, Y1, b + .62]])}" fill="${r() < 0.5 ? "#2456a6" : "#2f7d5b"}"/>`;
        out += `<polygon points="${pts([[X1, Y0 + .3, b + ch * .45], [X1, Y0 + .55, b + ch * .45], [X1, Y0 + .55, b + ch * .45 + .35], [X1, Y0 + .3, b + ch * .45 + .35]])}" fill="#23395b"/>`;
        if (r() < 0.6) {
          out += `<polygon points="${pts([[X0, Y0, b + ch], [X1, Y0, b + ch], [X1, Y1, b + ch], [X0, Y1, b + ch]])}" fill="#c4572d"/>`;
          out += `<polygon points="${pts([[X0, Y1, b + ch], [X1, Y1, b + ch], [X1 - .35, Y1 - .35, b + ch + .5], [X0 + .35, Y1 - .35, b + ch + .5]])}" fill="#d9683a"/>`;
        } else {
          out += `<polygon points="${pts([[X0, Y0, b + ch], [X1, Y0, b + ch], [X1, Y1, b + ch], [X0, Y1, b + ch]])}" fill="#ffffff"/>`;
        }
      } else if (tipo < 0.75) {
        const [tx, ty] = iso(x + 0.5, y + 0.5, h);
        out += `<rect x="${tx - 2}" y="${ty - 20}" width="4" height="20" fill="#6b4a2b"/><circle cx="${tx}" cy="${ty - 28}" r="19" fill="#3e7c3a"/><circle cx="${tx - 5}" cy="${ty - 32}" r="3" fill="#f39c12"/><circle cx="${tx + 6}" cy="${ty - 25}" r="3" fill="#f39c12"/>`;
      }
    }
    document.getElementById("s").innerHTML = out;
    listo();
  </script>
</body>
</html>
