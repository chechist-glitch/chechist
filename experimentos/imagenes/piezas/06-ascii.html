<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/base.css" />
<script src="../assets/lib.js"></script>
<style>
  body { background: #0c0a06; }
  pre { position: absolute; left: 0; top: 0; font-family: "Space Mono"; font-size: 20px; line-height: 18px; letter-spacing: 0; color: #ffb000; text-shadow: 0 0 6px rgba(255, 176, 0, .6); white-space: pre; }
</style>
</head>
<body>
  <pre id="p"></pre>
  <script>
    // Cada carácter es un "píxel": se calcula la luz de la escena y se elige un símbolo más o menos denso
    const n = makeNoise(3);
    const COLS = 90, ROWS = 75;
    const rampa = " .·:-=+*o#%@";
    const texto = "  ATARDECER EN CÁDIZ  ";
    let out = "";
    for (let j = 0; j < ROWS; j++) {
      let fila = "";
      for (let i = 0; i < COLS; i++) {
        const x = (i - COLS / 2) / (COLS / 2);
        const y = (j - 36) / 37.5 * 1.25;
        let v = 0;
        const horizonte = 0.18;
        if (y < horizonte) {
          const d = Math.hypot(x, (y + 0.1) * 1.1);
          v = Math.max(0, 1 - d / 0.42) ** 0.6;                       // sol
          const ang = Math.atan2(y + 0.1, x);
          if (d > 0.45) v = Math.max(v, (Math.cos(ang * 18) > 0.93 ? 0.35 : 0) * Math.max(0, 1 - d / 1.3)); // rayos
          v = Math.max(v, n(i * 0.08, j * 0.3, 2) > 0.62 ? 0.18 : 0);   // nubes
        } else {
          const prof = (y - horizonte) + 0.02;
          const ola = Math.sin(i * 0.9 / (prof * 6 + 0.4) + j * 1.7) * 0.5 + 0.5;
          const reflejo = Math.max(0, 1 - Math.abs(x) / (0.28 + prof * 0.4)) * (ola > 0.55 ? 1 : 0.2);
          v = Math.max(reflejo * 0.9, ola * 0.12);
        }
        fila += rampa[Math.min(rampa.length - 1, Math.floor(v * rampa.length))];
      }
      if (j === 68) fila = fila.slice(0, 34) + texto + fila.slice(34 + texto.length);
      out += fila + "\n";
    }
    document.getElementById("p").textContent = out;
    listo();
  </script>
</body>
</html>
