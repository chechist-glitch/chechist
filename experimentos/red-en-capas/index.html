<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three.module.js",
          "three/addons/": "./assets/vendor/jsm/"
        }
      }
    </script>
    <style>
      @font-face { font-family: "Space Mono"; src: url("assets/fonts/space-mono-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Space Mono"; font-weight: 700; src: url("assets/fonts/space-mono-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 500; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "DM Serif"; font-style: italic; src: url("assets/fonts/dm-serif-display-latin-400-italic.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #04050a; }
      #root { width: 100%; height: 100%; color: #e9e6f2; font-family: "Inter", sans-serif; }
      #lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #vineta { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(2,2,6,.8) 100%); }
      /* Rótulos de cada capa: se colocan proyectando su punto 3D en cada fotograma */
      .etq { position: absolute; left: 0; top: 0; opacity: 0; white-space: nowrap; font-family: "Space Mono", monospace; }
      .etq b { display: block; font-weight: 700; font-size: 21px; letter-spacing: .12em; }
      .etq span { display: block; font-size: 16px; color: rgba(233, 230, 242, .62); margin-top: 2px; letter-spacing: .02em; }
      .clip.transparent { background: transparent; }
      .acto { position: absolute; left: 90px; top: 80px; font-family: "Space Mono", monospace; font-size: 20px; letter-spacing: .3em; color: rgba(233, 230, 242, .75); text-transform: uppercase; }
      .acto i { font-style: normal; color: rgba(233, 230, 242, .35); margin-right: 18px; }
      .final { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 120px; }
      #titulo { font-family: "DM Serif", serif; font-style: italic; font-size: 76px; color: #f4f1fb; text-shadow: 0 4px 40px rgba(0,0,0,.8); display: block; }
      #firma { font-family: "Space Mono", monospace; font-size: 18px; letter-spacing: .4em; color: rgba(233, 230, 242, .55); margin-top: 18px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="26" data-width="1920" data-height="1080">
      <canvas id="lienzo" width="1920" height="1080"></canvas>
      <div id="vineta"></div>
      <div id="etiquetas"></div>

      <section id="a1" class="clip transparent" data-start="0" data-duration="4.6" data-track-index="1"><p class="acto" id="t1"><i>01</i>tramado</p></section>
      <section id="a2" class="clip transparent" data-start="4.6" data-duration="4.4" data-track-index="1"><p class="acto" id="t2"><i>02</i>se hila</p></section>
      <section id="a3" class="clip transparent" data-start="9" data-duration="4.4" data-track-index="1"><p class="acto" id="t3"><i>03</i>una persona</p></section>
      <section id="a4" class="clip transparent" data-start="13.4" data-duration="8" data-track-index="1"><p class="acto" id="t4"><i>04</i>todo, en capas</p></section>
      <section id="a5" class="clip transparent" data-start="21.4" data-duration="4.6" data-track-index="1">
        <p class="acto" id="t5"><i>05</i>y vuelta a cerrar</p>
        <div class="final"><h1 id="titulo">Todo lo que eres, bien hilado.</h1><p id="firma">CHECHIST · 2026</p></div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const actos = [["#t1", 0.4, 4.0], ["#t2", 4.8, 8.5], ["#t3", 9.2, 12.9], ["#t4", 13.6, 20.9], ["#t5", 21.6, 25.4]];
      for (const [sel, a, b] of actos) {
        tl.fromTo(sel, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, a);
        tl.to(sel, { opacity: 0, duration: 0.5, ease: "power2.in" }, b);
      }
      tl.fromTo("#titulo", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" }, 23.4);
      tl.fromTo("#firma", { opacity: 0 }, { opacity: 1, duration: 1, ease: "power2.out" }, 24.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>

    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      // ---------- utilidades ----------
      function rng(seed) {
        let a = seed >>> 0;
        return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      }
      const r = rng(2026);
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const suave = (t, a, b) => { const x = clamp01((t - a) / (b - a)); return x * x * (3 - 2 * x); };
      const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const DUR = 26;

      // ---------- capas (funciones cerebrales) ----------
      const CAPAS = [
        ["TRONCO", "respirar, latir, despertar", "#ff5a36"],
        ["CEREBELO", "equilibrio y movimiento fino", "#ff8f3d"],
        ["EMOCIÓN", "miedo, alegría, deseo", "#ff4f8b"],
        ["MEMORIA", "lo vivido, guardado", "#ffc857"],
        ["SENTIDOS", "ver, oír, tocar", "#6fe0f0"],
        ["LENGUAJE", "palabras y significado", "#4d9de0"],
        ["DECISIÓN", "planes, frenos, juicio", "#9b7bff"],
        ["CONSCIENCIA", "atención, el «yo»", "#c9b6ff"],
      ];
      const colCapa = CAPAS.map(([, , c]) => new THREE.Color(c));
      const yCapa = (L) => -2.87 + L * 0.82;

      // ---------- neuronas ----------
      const neuronas = []; // {net: Vector3, capa, fase}
      const CEN = new THREE.Vector3(-0.05, 0.85, 0), RAD = new THREE.Vector3(1.45, 0.95, 1.1);
      while (neuronas.length < 2600) {
        const q = new THREE.Vector3(r() * 2 - 1, r() * 2 - 1, r() * 2 - 1);
        const d = q.length();
        if (d > 1 || r() > 0.3 + 0.7 * d * d) continue;
        let capa;
        if (d < 0.55) capa = q.y < -0.05 ? 3 : 2;
        else if (q.x > 0.35) capa = 6;
        else if (q.x < -0.45) capa = 4;
        else if (q.y > 0.45) capa = 7;
        else if (Math.abs(q.z) > 0.35) capa = 5;
        else capa = 7;
        neuronas.push({ net: q.clone().multiply(RAD).add(CEN), capa });
      }
      for (let i = 0; i < 300; i++) { // cerebelo
        const q = new THREE.Vector3(r() * 2 - 1, r() * 2 - 1, r() * 2 - 1);
        if (q.length() > 1) { i--; continue; }
        neuronas.push({ net: new THREE.Vector3(-1.0 + q.x * 0.5, -0.2 + q.y * 0.32, q.z * 0.6), capa: 1 });
      }
      for (let i = 0; i < 160; i++) { // tronco
        const t = r(), a = r() * Math.PI * 2, rr = Math.sqrt(r()) * 0.16;
        neuronas.push({ net: new THREE.Vector3(-0.3 - t * 0.12 + Math.cos(a) * rr, 0.05 - t * 1.5, Math.sin(a) * rr), capa: 0 });
      }
      const N = neuronas.length;
      // Posición en la pila: cada capa se reparte por toda su placa
      for (let L = 0; L < 8; L++) {
        const grupo = neuronas.filter((n) => n.capa === L);
        let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
        for (const n of grupo) { x0 = Math.min(x0, n.net.x); x1 = Math.max(x1, n.net.x); z0 = Math.min(z0, n.net.z); z1 = Math.max(z1, n.net.z); }
        for (const n of grupo) {
          const u = (n.net.x - x0) / (x1 - x0 || 1) * 2 - 1, v = (n.net.z - z0) / (z1 - z0 || 1) * 2 - 1;
          n.pila = new THREE.Vector3(u * 1.85, yCapa(L) + (r() - 0.5) * 0.04, v * 1.2);
        }
      }
      neuronas.forEach((n) => { n.fase = r() * Math.PI * 2; n.jit = r(); });

      // ---------- conexiones ----------
      const aristas = [];
      const vistas = new Set();
      const unir = (a, b, larga = false) => {
        if (a === b) return;
        if (neuronas[a].capa > neuronas[b].capa) [a, b] = [b, a];
        const k = a < b ? a + "-" + b : b + "-" + a;
        if (vistas.has(k)) return;
        vistas.add(k);
        const eje = new THREE.Vector3(r() - 0.5, r() - 0.5, r() - 0.5).normalize();
        aristas.push({ a, b, eje, curva: (r() - 0.5) * 0.7, vel: 0.3 + r() * 0.35, fase: r(), larga, lev: (r() - 0.5) * 1.6 });
      };
      for (let i = 0; i < N; i++) {
        const best = [];
        for (let j = 0; j < N; j++) {
          if (i === j) continue;
          const d = neuronas[i].net.distanceToSquared(neuronas[j].net);
          if (best.length < 3) { best.push([d, j]); best.sort((x, y) => x[0] - y[0]); }
          else if (d < best[2][0]) { best[2] = [d, j]; best.sort((x, y) => x[0] - y[0]); }
        }
        for (const [, j] of best) unir(i, j);
      }
      // Hilos largos entre capas vecinas: en la pila serán los cables verticales
      const porCapa = [...Array(8)].map((_, L) => neuronas.map((n, i) => (n.capa === L ? i : -1)).filter((i) => i >= 0));
      for (let k = 0; k < 360; k++) {
        const L = k % 7;
        const a = porCapa[L][Math.floor(r() * porCapa[L].length)], b = porCapa[L + 1][Math.floor(r() * porCapa[L + 1].length)];
        unir(a, b, true);
      }
      const E = aristas.length;

      // ---------- el tramado inicial ----------
      // Cada hilo empieza como un trozo de línea horizontal en un grabado.
      const ANCHO = 10.6, ALTO = 6.0;
      const orden = aristas.map((e, i) => i).sort((i, j) => {
        const ei = aristas[i], ej = aristas[j];
        const yi = neuronas[ei.a].net.y + neuronas[ei.b].net.y, yj = neuronas[ej.a].net.y + neuronas[ej.b].net.y;
        return yj - yi;
      });
      const FILAS = 128, PORFILA = Math.ceil(E / FILAS);
      for (let f = 0; f < FILAS; f++) {
        const fila = orden.slice(f * PORFILA, (f + 1) * PORFILA).sort((i, j) => {
          const ei = aristas[i], ej = aristas[j];
          return neuronas[ei.a].net.x + neuronas[ei.b].net.x - neuronas[ej.a].net.x - neuronas[ej.b].net.x;
        });
        // Largos al azar para que los cortes no se alineen en columnas
        const pesos = fila.map(() => 0.45 + r());
        const total = pesos.reduce((a, b) => a + b, 0);
        let x = -ANCHO / 2;
        fila.forEach((idx, c) => {
          const e = aristas[idx];
          const largo = (pesos[c] / total) * ANCHO;
          e.hx0 = x + 0.008;
          e.hx1 = x + largo - 0.008;
          x += largo;
          e.hy = ALTO / 2 - (f + 0.5) * (ALTO / FILAS);
          // La ola que suelta los hilos va de izquierda a derecha
          e.t0 = 2.4 + ((e.hx0 + ANCHO / 2) / ANCHO) * 3.6 + r() * 0.8 + (f % 7) * 0.02;
        });
      }

      // ---------- escena ----------
      const canvas = document.getElementById("lienzo");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x04050a);
      const camara = new THREE.PerspectiveCamera(35, 1920 / 1080, 0.1, 100);

      const SEG = 10;
      const VPA = SEG * 2; // vértices por arista (LineSegments)
      const posArr = new Float32Array(E * VPA * 3);
      const colArr = new Float32Array(E * VPA * 3);
      const geoHilos = new THREE.BufferGeometry();
      geoHilos.setAttribute("position", new THREE.BufferAttribute(posArr, 3));
      geoHilos.setAttribute("color", new THREE.BufferAttribute(colArr, 3));
      const matHilos = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
      const hilos = new THREE.LineSegments(geoHilos, matHilos);
      hilos.frustumCulled = false;
      scene.add(hilos);

      // Somas de las neuronas
      const cv = document.createElement("canvas"); cv.width = cv.height = 64;
      const g2 = cv.getContext("2d");
      const grd = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
      grd.addColorStop(0, "rgba(255,255,255,1)"); grd.addColorStop(0.25, "rgba(255,255,255,.8)"); grd.addColorStop(1, "rgba(255,255,255,0)");
      g2.fillStyle = grd; g2.fillRect(0, 0, 64, 64);
      const texPunto = new THREE.CanvasTexture(cv);
      const pPos = new Float32Array(N * 3), pCol = new Float32Array(N * 3);
      const geoP = new THREE.BufferGeometry();
      geoP.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      geoP.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
      const matP = new THREE.PointsMaterial({ size: 0.05, map: texPunto, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 });
      const puntos = new THREE.Points(geoP, matP);
      puntos.frustumCulled = false;
      scene.add(puntos);

      // Perfil de la cabeza (mirando a la derecha), a doble línea como un grabado
      const perfil = [[-0.9, -2.5], [-1.0, -1.6], [-1.55, -0.9], [-1.85, -0.1], [-1.82, 0.7], [-1.45, 1.45], [-0.75, 1.92], [0.1, 2.03], [0.9, 1.8], [1.45, 1.25], [1.66, 0.62], [1.72, 0.36], [1.62, 0.2], [1.7, 0.04], [1.97, -0.36], [1.73, -0.5], [1.76, -0.62], [1.68, -0.72], [1.74, -0.83], [1.6, -0.96], [1.66, -1.2], [1.46, -1.4], [0.92, -1.5], [0.72, -1.72], [0.78, -2.5]];
      const curvaPerfil = new THREE.CatmullRomCurve3(perfil.map(([x, y]) => new THREE.Vector3(x, y, 0)), false, "centripetal");
      const oreja = new THREE.CatmullRomCurve3([[-0.2, 0.18], [0.02, 0.1], [0.06, -0.2], [-0.05, -0.45], [-0.2, -0.52]].map(([x, y]) => new THREE.Vector3(x, y, 0)));
      // El tramado ya "sabe" dónde está la cabeza: dentro del perfil las líneas brillan más
      const silueta = curvaPerfil.getPoints(200).map((p) => [p.x, p.y]);
      silueta.push([-0.9, -3.2], [0.8, -3.2]);
      const dentro = (x, y) => {
        let c = false;
        for (let i = 0, j = silueta.length - 1; i < silueta.length; j = i++) {
          const [xi, yi] = silueta[i], [xj, yj] = silueta[j];
          if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
        }
        return c;
      };
      const brilloTramado = new Float32Array(E * VPA);
      {
        let v = 0;
        for (const ar of aristas) for (let s = 0; s < SEG; s++) for (const u of [s / SEG, (s + 1) / SEG]) {
          const hx = ar.hx0 + (ar.hx1 - ar.hx0) * u;
          const cerebro = ((hx - CEN.x) / RAD.x) ** 2 + ((ar.hy - CEN.y) / RAD.y) ** 2 < 1;
          brilloTramado[v++] = 0.16 + (dentro(hx, ar.hy) ? 0.21 : 0) + (cerebro ? 0.04 : 0);
        }
      }
      const lineasCabeza = [];
      for (const [curva, esc, n] of [[curvaPerfil, 1, 600], [curvaPerfil, 0.975, 600], [oreja, 1, 120]]) {
        const pts = curva.getPoints(n).map((p) => p.clone().multiplyScalar(esc).setY(p.y * esc + (1 - esc) * 0.3));
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const mat = new THREE.LineBasicMaterial({ color: 0xf1e6d2, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
        const l = new THREE.Line(geo, mat);
        l.userData.n = pts.length;
        scene.add(l);
        lineasCabeza.push(l);
      }

      // Placas de la pila: contorno redondeado, relleno muy tenue y guía hacia el rótulo
      const placas = [];
      const etiquetas = document.getElementById("etiquetas");
      for (let L = 0; L < 8; L++) {
        const forma = new THREE.Shape();
        const w = 2.05, d = 1.38, rr = 0.18;
        forma.moveTo(-w + rr, -d); forma.lineTo(w - rr, -d); forma.quadraticCurveTo(w, -d, w, -d + rr); forma.lineTo(w, d - rr); forma.quadraticCurveTo(w, d, w - rr, d);
        forma.lineTo(-w + rr, d); forma.quadraticCurveTo(-w, d, -w, d - rr); forma.lineTo(-w, -d + rr); forma.quadraticCurveTo(-w, -d, -w + rr, -d);
        const pts = forma.getPoints(40).map((p) => new THREE.Vector3(p.x, yCapa(L), p.y));
        pts.push(new THREE.Vector3(w, yCapa(L), d), new THREE.Vector3(w + 1.0, yCapa(L), d));
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const mat = new THREE.LineBasicMaterial({ color: colCapa[L], transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
        const borde = new THREE.Line(geo, mat);
        const relleno = new THREE.Mesh(new THREE.ShapeGeometry(forma, 12), new THREE.MeshBasicMaterial({ color: colCapa[L], transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
        relleno.rotation.x = Math.PI / 2; relleno.position.y = yCapa(L);
        scene.add(borde, relleno);
        const el = document.createElement("div");
        el.className = "etq";
        el.innerHTML = `<b style="color:${CAPAS[L][2]}">L${L} · ${CAPAS[L][0]}</b><span>${CAPAS[L][1]}</span>`;
        etiquetas.appendChild(el);
        placas.push({ borde, relleno, el, n: pts.length, ancla: new THREE.Vector3(w + 1.08, yCapa(L), d) });
      }

      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(1);
      composer.setSize(1920, 1080);
      composer.addPass(new RenderPass(scene, camara));
      const bloom = new UnrealBloomPass(new THREE.Vector2(1920, 1080), 0.7, 0.5, 0.1);
      composer.addPass(bloom);
      composer.addPass(new OutputPass());

      // ---------- cámara: poses clave ----------
      const poses = [
        [0, [0, 0, 9.2], [0, 0, 0]],
        [2.4, [0, 0, 9.2], [0, 0, 0]],
        [6.5, [2.2, 0.8, 8.4], [0, 0.25, 0]],
        [9.5, [0.35, 0.15, 8.8], [0, 0.05, 0]],
        [12.8, [0.1, 0.1, 8.3], [0, 0, 0]],
        [16.5, [9.9, 2.8, 11.0], [1.1, -0.1, 0]],
        [20.8, [8.7, 2.2, 9.7], [1.1, 0.1, 0]],
        [23.4, [0.3, 0.2, 8.6], [0, 0, 0]],
        [26, [0.1, 0.12, 8.0], [0, 0, 0]],
      ];
      const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
      function pose(t) {
        let i = 0;
        while (i < poses.length - 2 && t > poses[i + 1][0]) i++;
        const [ta, pa, la] = poses[i], [tb, pb, lb] = poses[i + 1];
        const k = inOut(clamp01((t - ta) / (tb - ta)));
        camara.position.set(...pa.map((v, j) => v + (pb[j] - v) * k));
        tmpA.set(...la.map((v, j) => v + (lb[j] - v) * k));
        camara.lookAt(tmpA);
        camara.updateMatrixWorld();
      }

      // ---------- un fotograma ----------
      const actual = neuronas.map(() => new THREE.Vector3());
      const papel = new THREE.Color(0.62, 0.57, 0.5);
      const P0 = new THREE.Vector3(), P1 = new THREE.Vector3(), C = new THREE.Vector3(), Q = new THREE.Vector3(), D = new THREE.Vector3();
      const cA = new THREE.Color(), cB = new THREE.Color(), cc = new THREE.Color();
      function renderAt(time) {
        const t = Math.max(0, Math.min(DUR, time));
        pose(t);

        // Posición de cada neurona: red ↔ pila
        const respira = 1 - suave(t, 13, 14.5) * 0.7;
        neuronas.forEach((n, i) => {
          const L = n.capa;
          const ida = inOut(suave(t, 13.4 + L * 0.22 + n.jit * 0.35, 15.8 + L * 0.22 + n.jit * 0.35));
          const vuelta = inOut(suave(t, 21.3 + (7 - L) * 0.12 + n.jit * 0.3, 23.3 + (7 - L) * 0.12 + n.jit * 0.3));
          const s = ida * (1 - vuelta);
          actual[i].lerpVectors(n.net, n.pila, s);
          actual[i].y += Math.sin(t * 1.1 + n.fase) * 0.012 * respira;
          actual[i].x += Math.cos(t * 0.9 + n.fase) * 0.012 * respira;
        });

        const pulsoRed = suave(t, 6.5, 8.5);
        const modoPila = suave(t, 15, 16.5) * (1 - suave(t, 21, 22));
        let v = 0;
        for (let e = 0; e < E; e++) {
          const ar = aristas[e];
          const m = inOut(suave(t, ar.t0, ar.t0 + 2.4));
          P0.copy(actual[ar.a]); P1.copy(actual[ar.b]);
          D.subVectors(P1, P0);
          const len = D.length();
          C.crossVectors(D, ar.eje).normalize().multiplyScalar(len * ar.curva * (1 - modoPila * 0.6));
          C.addScaledVector(P0, 0.5).addScaledVector(P1, 0.5);
          cA.copy(colCapa[neuronas[ar.a].capa]); cB.copy(colCapa[neuronas[ar.b].capa]);
          const fase = (t * ar.vel + ar.fase) % 1;
          const fuerzaPulso = pulsoRed * (ar.larga ? 1 + modoPila * 1.4 : 1 - modoPila * 0.55);
          const base = (0.12 + (ar.larga ? modoPila * 0.1 : 0)) * (1 - modoPila * 0.45);
          for (let s = 0; s < SEG; s++) {
            for (const u of [s / SEG, (s + 1) / SEG]) {
              // Curva de la red (Bézier cuadrática)
              const iu = 1 - u;
              Q.set(iu * iu * P0.x + 2 * iu * u * C.x + u * u * P1.x, iu * iu * P0.y + 2 * iu * u * C.y + u * u * P1.y, iu * iu * P0.z + 2 * iu * u * C.z + u * u * P1.z);
              // Posición en el tramado
              const hx = ar.hx0 + (ar.hx1 - ar.hx0) * u;
              const hy = ar.hy + Math.sin(hx * 2.3 + ar.hy * 5) * 0.012 + Math.sin(t * 2 + hx * 6) * 0.004;
              const lev = Math.sin(Math.PI * m) * ar.lev;
              posArr[v * 3] = hx + (Q.x - hx) * m;
              posArr[v * 3 + 1] = hy + (Q.y - hy) * m;
              posArr[v * 3 + 2] = Q.z * m + lev;
              // Color: papel en el tramado, color de su capa en la red, y el pulso encima
              const d = u - fase;
              const pulso = Math.exp(-(d * d) * 90) * fuerzaPulso;
              cc.copy(cA).lerp(cB, u);
              const br = base + pulso * 1.5;
              const hb = brilloTramado[v] * (1 - m);
              colArr[v * 3] = papel.r * hb + cc.r * br * m;
              colArr[v * 3 + 1] = papel.g * hb + cc.g * br * m;
              colArr[v * 3 + 2] = papel.b * hb + cc.b * br * m;
              v++;
            }
          }
        }
        geoHilos.attributes.position.needsUpdate = true;
        geoHilos.attributes.color.needsUpdate = true;

        neuronas.forEach((n, i) => {
          pPos[i * 3] = actual[i].x; pPos[i * 3 + 1] = actual[i].y; pPos[i * 3 + 2] = actual[i].z;
          const c = colCapa[n.capa], b = 0.55 + 0.45 * Math.sin(t * 3 + n.fase);
          pCol[i * 3] = c.r * b; pCol[i * 3 + 1] = c.g * b; pCol[i * 3 + 2] = c.b * b;
        });
        geoP.attributes.position.needsUpdate = true;
        geoP.attributes.color.needsUpdate = true;
        matP.opacity = suave(t, 6, 9) * 0.9;

        // Cabeza: se dibuja, se desvanece al abrir la pila y vuelve al final
        const dibujo = t < 20 ? suave(t, 8.8, 11.8) : 1;
        const opCabeza = Math.max(suave(t, 8.8, 9.6) * (1 - suave(t, 13.2, 14.4)), suave(t, 22.3, 24));
        lineasCabeza.forEach((l, k) => {
          l.geometry.setDrawRange(0, Math.floor(l.userData.n * dibujo));
          l.material.opacity = opCabeza * (k === 1 ? 0.35 : 0.8);
        });

        // Placas y rótulos
        const fuera = 1 - suave(t, 20.9, 21.7);
        placas.forEach((p, L) => {
          const pr = suave(t, 14.3 + L * 0.25, 15.5 + L * 0.25);
          p.borde.geometry.setDrawRange(0, Math.floor(p.n * pr));
          p.borde.material.opacity = 0.75 * pr * fuera;
          p.relleno.material.opacity = 0.05 * pr * fuera;
          const a = suave(t, 15.1 + L * 0.28, 15.8 + L * 0.28) * fuera;
          p.el.style.opacity = a.toFixed(3);
          Q.copy(p.ancla).project(camara);
          const sx = (Q.x + 1) / 2 * 1920 + 14, sy = (1 - Q.y) / 2 * 1080 - 22;
          p.el.style.transform = `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px)`;
        });

        composer.render();
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      document.fonts.ready.then(() => renderAt(window.__hfThreeTime || 0));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
