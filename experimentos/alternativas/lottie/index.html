<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>html, body { margin: 0; background: #1b1030; overflow: hidden; } #anim { width: 1280px; height: 720px; } .p { position: absolute; left: 22px; bottom: 16px; font: 16px "DejaVu Sans"; color: #ffffff88; }</style>
</head>
<body>
  <div id="anim"></div>
  <div class="p">Lottie · JSON vectorial reproducido con lottie-web</div>
  <script type="module">
    import lottie from "lottie-web";
    import datos from "./abanico.json";
    const a = lottie.loadAnimation({ container: document.getElementById("anim"), renderer: "svg", loop: false, autoplay: false, animationData: datos });
    a.addEventListener("DOMLoaded", () => (window.__listo = true));
    window.pintar = (t) => a.goToAndStop(t * 1000, false);
  </script>
</body>
</html>
