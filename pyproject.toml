[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "centinela"
version = "0.1.0"
description = "Rastreo y documentación de comentarios de odio en medios digitales (fase 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
centinela = "centinela.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
